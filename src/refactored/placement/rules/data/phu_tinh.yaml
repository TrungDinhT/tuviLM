  - component_id: hoa_cai
    kind: absolute_by_dia_chi_groups
    groups:
      - dia_chi: [than, ty, thin]
        position: thin
      - dia_chi: [ti, dau, suu]
        position: suu
      - dia_chi: [dan, ngo, tuat]
        position: tuat
      - dia_chi: [hoi, meo, mui]
        position: mui

  - component_id: dao_hoa
    kind: absolute_by_dia_chi_groups
    groups:
      - dia_chi: [than, ty, thin]
        position: dau
      - dia_chi: [ti, dau, suu]
        position: ngo
      - dia_chi: [dan, ngo, tuat]
        position: meo
      - dia_chi: [hoi, meo, mui]
        position: ty

  - component_id: kiep_sat
    kind: absolute_by_dia_chi_groups
    groups:
      - dia_chi: [than, ty, thin]
        position: ti
      - dia_chi: [ti, dau, suu]
        position: dan
      - dia_chi: [dan, ngo, tuat]
        position: hoi
      - dia_chi: [hoi, meo, mui]
        position: than

  - component_id: pha_toai
    kind: absolute_by_dia_chi_groups
    groups:
      - dia_chi: [ty, ngo, meo, dau]
        position: ti
      - dia_chi: [thin, tuat, suu, mui]
        position: suu
      - dia_chi: [dan, than, ti, hoi]
        position: dau

  - component_id: ta_phu
    kind: from_anchor
    anchor:
      kind: dia_chi
      value: thin
    transform: move_by_birth_month
    direction: cw

  - component_id: huu_bat
    kind: from_anchor
    anchor:
      kind: dia_chi
      value: tuat
    transform: move_by_birth_month
    direction: ccw

  - component_id: thien_giai
    kind: from_anchor
    anchor:
      kind: dia_chi
