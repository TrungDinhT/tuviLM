  - component_id: thien_quy
    kind: relative
    reference_id: van_khuc
    transform: move_by_birth_date
    direction: ccw
    date_offset: -2

  - component_id: dia_khong
    kind: from_anchor
    anchor:
      kind: dia_chi
      value: hoi
    transform: move_by_birth_hour
    direction: ccw

  - component_id: dia_kiep
    kind: from_anchor
    anchor:
      kind: dia_chi
      value: hoi
    transform: move_by_birth_hour
    direction: cw

  - component_id: van_xuong
    kind: from_anchor
    anchor:
      kind: dia_chi
