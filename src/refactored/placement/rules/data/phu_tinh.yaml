      - truc_phu

  - kind: circle
    principal_id: trang_sinh
    anchor:
      kind: formula
      name: trang_sinh_position
    direction: van
    others:
      - moc_duc
      - quan_doi
      - lam_quan
      - de_vuong
      - suy
      - benh
      - tu
      - mo
      - tuyet
      - thai
      - duong

  - component_id: thien_khoi
    kind: absolute_by_thien_can
    mapping:
      giap: suu
      at: ty
      binh: hoi
      dinh: hoi
      mau: suu
      ky: ty
      canh: ngo
      tan: ngo
      nham: meo
      quy: meo

  - component_id: thien_viet
    kind: absolute_by_thien_can
    mapping:
      giap: mui
      at: than
      binh: dau
      dinh: dau
      mau: mui
      ky: than
      canh: dan
      tan: dan
      nham: ti
      quy: ti

  - component_id: luu_ha
    kind: absolute_by_thien_can
    mapping:
      giap: dau
      at: tuat
      binh: mui
      dinh: thin
      mau: ti
      ky: ngo
      canh: than
      tan: thin
      nham: hoi
      quy: dan

  - component_id: thien_tru
    kind: absolute_by_thien_can
    mapping:
      giap: ti
      at: ngo
      binh: ty
      dinh: ti
      mau: ngo
      ky: than
      canh: dan
      tan: ngo
      nham: dau
      quy: tuat

  - component_id: thien_quan
    kind: absolute_by_thien_can
    mapping:
      giap: mui
      at: mui
      binh: thin
      dinh: dan
      mau: meo
      ky: dau
      canh: hoi
      tan: dau
      nham: tuat
      quy: ngo

  - component_id: thien_phuc
    kind: absolute_by_thien_can
    mapping:
      giap: dau
      at: dau
      binh: than
      dinh: hoi
      mau: meo
      ky: dan
      canh: ngo
      tan: ti
      nham: ngo
      quy: ti

  - component_id: co_than
    kind: absolute_by_dia_chi_groups
    groups:
      - dia_chi: [dan, meo, thin]
        position: ti
      - dia_chi: [ti, ngo, mui]
        position: than
      - dia_chi: [than, dau, tuat]
        position: hoi
      - dia_chi: [hoi, ty, suu]
        position: mui

  - component_id: qua_tu
    kind: absolute_by_dia_chi_groups
    groups:
      - dia_chi: [dan, meo, thin]
        position: suu
      - dia_chi: [ti, ngo, mui]
        position: thin
      - dia_chi: [than, dau, tuat]
        position: dan
      - dia_chi: [hoi, ty, suu]
        position: tuat

  - component_id: thien_hi
    kind: from_anchor
    anchor:
      kind: dia_chi
      value: dau
    transform: move_by_dia_chi
    direction: ccw

  - component_id: hong_loan
    kind: relative
    reference_id: thien_hi
    transform: xung_chieu

  - component_id: giai_than
    kind: from_anchor
    anchor:
      kind: dia_chi
