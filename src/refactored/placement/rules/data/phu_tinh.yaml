    formula: dau_quan_position

  - component_id: hoa_tinh
    kind: from_anchor
    anchor:
      kind: dia_chi_groups
      groups:
        - dia_chi: [than, ty, thin]
          position: dan
        - dia_chi: [ti, dau, suu]
          position: meo
        - dia_chi: [dan, ngo, tuat]
          position: suu
        - dia_chi: [hoi, meo, mui]
          position: dau
    transform: move_by_van_direction
    step: birth_hour_index

  - component_id: linh_tinh
    kind: from_anchor
    anchor:
      kind: dia_chi_groups
      groups:
        - dia_chi: [than, ty, thin]
          position: tuat
        - dia_chi: [ti, dau, suu]
          position: tuat
        - dia_chi: [dan, ngo, tuat]
          position: meo
        - dia_chi: [hoi, meo, mui]
          position: tuat
    transform: move_by_van_direction
    step: birth_hour_index
