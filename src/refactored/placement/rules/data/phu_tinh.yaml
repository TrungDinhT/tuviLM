rules:
  - kind: circle
    principal_id: bac_si
    anchor:
      kind: formula
      name: loc_ton_position
    direction: van
    others:
      - luc_si
      - thanh_long
      - tieu_hao
      - tuong_quan
      - tau_thu
      - phi_liem
      - hy_than
      - benh_phu
      - dai_hao
      - phuc_binh
      - quan_phur

  - kind: offset_group
    anchor_id: loc_ton
    anchor:
      kind: formula
      name: loc_ton_position
    offsets:
      kinh_duong: 1
      da_la: -1
      ln_van_tinh: 3
      duong_phu: 5
      quoc_an: 8

  - kind: circle
    principal_id: thai_tue
    anchor:
      kind: formula
      name: thai_tue_position
    others:
      - kind: same_position
        component_id: thieu_duong
        reference_id: thien_khong
      - tang_mon
      - thieu_am
      - kind: same_position
        component_id: quan_phuf
        reference_id: long_tri
      - kind: same_position
        component_id: tu_phu
