    anchor:
      kind: dia_chi
      value: thin
    transform: move_by_birth_hour
    direction: cw

  - component_id: thai_phu
    kind: from_anchor
    anchor:
      kind: dia_chi
      value: ngo
    transform: move_by_birth_hour
    direction: cw

  - component_id: phong_cao
    kind: from_anchor
    anchor:
      kind: dia_chi
