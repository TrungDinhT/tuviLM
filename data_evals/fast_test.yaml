        gender: F
      query: Cung Quan Lộc cho thấy khuynh hướng nghề nghiệp nào? Nêu cả điểm mạnh và rủi ro.
    expected_output:
      min_output_chars: 120
      required_substrings:
        - Quan Lộc
      forbidden_substrings:
