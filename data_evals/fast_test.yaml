name: tuvi_agent_eval
cases:
  - name: menh_overview
    inputs:
      tuvi_time:
        hour: Tý
        date: 10
        month: 3
        thien_can: Giấp
        dia_chi: Tý
        gender: M
      query: Luận giải ngắn gọn cung Mệnh, tập trung vào chính tinh và điểm cần thận trọng.
    expected_output:
      min_output_chars: 120
      required_substrings:
        - Mệnh
      forbidden_substrings:
