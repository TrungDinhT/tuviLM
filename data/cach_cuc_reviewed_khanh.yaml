- id: phu_du_ma
  name: Phù Du Mã
  page: 42
  priority: 3
  meaning: "Ngựa kéo xe vua : \n- chỉ người có tài năng, có thể giữ chức vụ cố vấn,\
    \ phụ tá cho cấp chỉ huy, hoặc làm giám đốc/cán bộ quản lý trong cơ sở hành chính,\
    \ thương mại; cũng có thể là người không giữ chức chính thức nhưng thường được\
    \ kề cận người có quyền thế\n- không nhất thiết là người đứng đầu tuyệt đối, mà\
    \ thường là người có năng lực phục vụ/quản trị cho hệ thống lớn, gần quyền lực,\
    \ được giao việc quan trọng, làm trợ thủ, cố vấn, quản lý, điều hành. "
  conditions:
    all:
    - type: stars_meeting
      scope: dong_cung
      stars:
      - thien_ma
      - thien_phu
      - tu_vi
    - type: star_with_palace
      palace: menh
      scope: dong_cung
      stars:
      - thien_ma
    - type: star_at_chi
      stars:
      - thien_ma
      at_chi:
      - dan
      - than
    - not:
        type: star_with_palace
        palace: menh
        scope: dong_cung
        stars:
        - tuan
        - triet
        - dia_khong
        - dia_kiep
        - da_la
