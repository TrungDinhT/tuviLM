  page: 46
  priority: 0
  meaning: "khí chất dũng mãnh, quyết liệt, có khả năng xông pha, phá vòng vây, lập\
    \ công trong môi trường cạnh tranh chiến đấu quyền lực. \nHay gắn với võ nghiệp,\
    \ binh nghiệp, uy danh, chiến tích.\nCách này không phải cứ có là đại quý. Nó\
    \ vẫn là bộ “phá”, nên nếu không có chính tinh/cát tinh nâng, hoặc bị sát bại\
    \ tinh xâm phạm quá mạnh, dễ thành: nóng nảy, táo bạo quá mức, tranh đấu, va chạm,\
