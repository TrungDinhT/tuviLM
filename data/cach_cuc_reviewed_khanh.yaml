- id: binh_hinh_tuong_an
  name: Binh Hình Tướng Ấn
  page: 43
  priority: 1
  meaning: 'người cầm quân có binh, có kiếm, có tướng quyền, có ấn lệnh. Vì vậy nó
    thường được luận là cách có quyền điều động, ra lệnh, quản lý, xử phạt hoặc nắm
    vai trò chỉ huy.

    Binh Hình Tướng Ấn chưa chắc là tướng quân thật sự, nhưng chắc chắn có nghĩa là
    người chỉ huy, người cầm đầu một tổ chức/đoàn thể. Ví dụ có thể là đội trưởng,
    trưởng nhóm, người quản lý, người đứng đầu một bộ phận.'
  conditions:
    all:
    - type: stars_meeting
      scope: hoi_hop
      stars:
      - thien_hinh
      - quoc_an
      - tuong_quan
      - phuc_binh
    - type: star_with_palace
      palace: menh
      scope: dong_cung
      stars:
      - tuong_quan
