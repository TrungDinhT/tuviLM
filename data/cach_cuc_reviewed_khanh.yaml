- id: menh_tuan_than_triet
  name: Mệnh Tuần, Thân Triệt
  page: 54
  priority: 3
  meaning: 'Mệnh Tuần Thân Triệt nghĩa là: gốc Mệnh bị che, ám, chậm mở, phần Thân
    bị cắt, chặn, gãy nhịp.

    Mệnh gặp Tuần: cái gốc con người, xuất phát điểm, tuổi trẻ, cách biểu hiện bản
    thân thường bị “ám”, chậm, khó mở, không thuận ngay.

    Thân gặp Triệt: phần hậu vận, hành động thực tế, sự tự lập, sự nghiệp/lối sống
    sau khi trưởng thành bị “chặn”, có lúc đang đi thì bị cắt ngang, đổi hướng mạnh.'
  conditions:
    all:
    - type: star_with_palace
      palace: menh
      scope: dong_cung
      stars:
      - tuan
    - type: star_with_palace
      palace: cung_than
      scope: dong_cung
      stars:
      - triet
- id: menh_triet_than_tuan
  name: Mệnh Triệt, Thân Tuần
  page: 54
  priority: 3
  meaning: 'Mệnh Triệt: phần gốc, tuổi trẻ, xuất phát điểm, môi trường đầu đời bị
    “cắt” mạnh. Mệnh gặp Triệt thường chủ tuổi nhỏ, đầu đời khó thuận, dễ có cảm giác
    bị chặn đường, bị cắt cơ hội, có biến cố làm thay đổi hướng phát triển.

    Thân Tuần: phần tự lập, hậu vận bị “vây”, bị chậm, bị ám, nhưng không đứt gãy
    mạnh như Triệt. Thân gặp Tuần ảnh hưởng phần sau 30 tuổi, phần tự lập, sự nghiệp
    thực tế, cách mình vận hành cuộc đời. Tuần không “chém/cắt” mạnh như Triệt, nhưng
    nó làm mọi việc chậm, vòng vèo, bị vây hãm, khó thỏa mãn trọn vẹn.'
  conditions:
    all:
    - type: star_with_palace
      palace: menh
      scope: dong_cung
      stars:
      - triet
    - type: star_with_palace
      palace: cung_than
      scope: dong_cung
      stars:
      - tuan
- id: menh_khong_than_kiep
  name: Mệnh Không, Thân Kiếp
  page: 54
  priority: 2
  meaning: Rất khôn ngoan sắc sảo, nhưng vui ít buồn nhiều, thành bại thất thường.
    chủ đời nhiều biến động, cực đoan, lên xuống mạnh, khó bình ổn; nhưng nếu đắc
    địa và được cát tinh nâng thì có thể thành người rất đặc biệt, có khả năng bứt
    phá trong hoàn cảnh bất thường.Địa Kiếp ở Mệnh thường làm người khó đi theo đường
    bình thường, có thể sắc bén, quyết liệt, nhưng cũng dễ cực đoan hoặc tự phá nếu
    thiếu kỷ luật.Thân có Địa Không, phần hậu vận, hành động thực tế, sự nghiệp sau
    khi trưởng thành dễ có cảm giác hư không, mất rồi lại có, có rồi lại mất, đổi
    hướng lớn, ngộ ra hoặc buông bỏ sau va vấp.
  conditions:
    all:
    - type: star_with_palace
      palace: menh
      scope: dong_cung
      stars:
      - dia_khong
    - type: star_with_palace
      palace: cung_than
      scope: dong_cung
      stars:
      - dia_kiep
