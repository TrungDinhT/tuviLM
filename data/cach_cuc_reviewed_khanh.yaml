- id: tu_ma
  name: Tử Mã
  page: 42
  priority: 0
  meaning: 'Mã lạc Không Vong: ngựa bị vây/chặn, mất đường chạy, nên khả năng động,
    phát, đi xa, xoay chuyển của Thiên Mã bị giảm hoặc biến xấu.

    Triệt có tính cắt, chặn mạnh, dứt khoát. Vì vậy Mã gặp Triệt thường xấu hơn Mã
    gặp Tuần.

    Tuần có tính vây, khoanh, trì hoãn, làm chậm. Vì vậy Mã gặp Tuần thường là chậm
    phát, bị kìm, đi đường vòng, nhưng không nhất thiết mất hết lực.'
  conditions:
    all:
    - any:
      - type: stars_meeting
        scope: dong_cung
        stars:
        - thien_ma
        - tuan
      - type: stars_meeting
        scope: dong_cung
        stars:
        - thien_ma
        - triet
    - any:
      - type: star_with_palace
        palace: menh
