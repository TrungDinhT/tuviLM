    tốt. Khẩu tài xuất sắc : Khẩu tài xuất sắc, thuyết phục tốt,tranh luận giỏi,đàm
    phán mạnh. Tuy nhiên, Cự Cơ Mão Dậu bất nghi gia : gia đạo khó yên, dễ khắc khẩu,hay
    tranh luận, khó hài lòng với người phối ngẫu.Thị phi nhiều, dễ bị hiểu lầm,.'
