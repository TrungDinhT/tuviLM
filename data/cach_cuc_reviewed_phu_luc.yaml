- id: tai_am_giap_an
  name: Tài Ấm Giáp Ấn
  page: 229
  priority: 3
  meaning: 'Đây là cách cục biểu hiện: Có tài năng quản lý, điều phối, Được người
    trên tin dùng, Danh và lợi đi cùng nhau, Dễ nắm chức vụ, quyền hành hoặc vị trí
    trung gian quan trọng.'
  conditions:
    any:
    - all:
      - type: star_with_palace
        palace: menh
        scope: hoi_hop
        stars:
        - thien_tuong
        stars_matching_logic: any
      - type: star_with_palace
        palace: menh
        scope: giap
        stars:
        - thien_luong
        stars_matching_logic: any
      - not:
          type: star_with_palace
          palace: menh
          scope: dong_cung
          stars:
          - tuan
          - triet
          stars_matching_logic: any
      - not:
          type: star_with_palace
          palace: menh
          scope: dong_cung
          group_name: luc_sat
          at_least: 2
    - all:
      - type: star_with_palace
        palace: dien_trach
        scope: hoi_hop
        stars:
        - thien_tuong
        stars_matching_logic: any
      - type: star_with_palace
        palace: dien_trach
        scope: giap
        stars:
        - thien_luong
        stars_matching_logic: any
      - not:
          type: star_with_palace
          palace: dien_trach
          scope: dong_cung
          stars:
          - tuan
          - triet
          stars_matching_logic: any
      - not:
          type: star_with_palace
          palace: dien_trach
          scope: dong_cung
          group_name: luc_sat
          at_least: 2
    - all:
