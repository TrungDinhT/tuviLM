  - id: khoi_viet_phu_tinh_vi_phuc_tho
    name:
      Khôi, Việt gặp nhiều sao sáng sủa tốt đẹp hội hợp / Khôi, Việt phụ tinh, vi
      phúc thọ
    page: 105
    priority: 1
    meaning:
      Có tài kiêm văn võ, óc lãnh tụ, mưu cơ tổ chức và sớm nhẹ bước thang mây;
      thường nắm giữ đầu mối những công việc lớn, có uy quyền hiển hách, hay lui tới
      gần bên bậc nguyên thủ; được hưởng phúc, giàu sang và sống lâu.
    evidence:
      Khôi, Việt gặp nhiều sao sáng sủa tốt đẹp hội hợp, nhất là Tử, Phủ Xương,
      Khúc, Tả, Hữu, Khoa, Quyền, Lộc nên có tài kiêm văn võ, có óc lãnh tụ, có mưu
      cơ tổ chức và sớm nhẹ bước thang mây, thường nắm giữ đầu mối những công việc lớn.
      nhỏ liên có uy quyền hiển hách, hay lui tới gần bên bậc nguyên thủ, lại được hưởng
      giàu sang và sống lâu. // Cung Mệnh có Khôi, Việt tọa thủ, lại gặp nhiều sao sáng
      sủa tốt đẹp hội hợp, nên được hưởng phúc và sống lâu.
    conditions:
      all:
        - type: star_with_palace
          palace: menh
          scope: dong_cung
          stars:
            - thien_khoi
            - thien_viet
          stars_matching_logic: any
        - type: star_with_palace
          palace: menh
          scope: hoi_hop
          group_name: cat_tinh
          at_least: 2
        - not:
            type: star_with_palace
            palace: menh
            scope: dong_cung
            stars:
              - tuan
              - triet
            stars_matching_logic: any
        - not:
            type: star_with_palace
            palace: menh
            scope: hoi_hop
            group_name: sat_tinh
            at_least: 2
