  - id: khoi_viet_gap_tuan_triet_hay_sat_tinh
    name: Khôi, Việt gặp Tuần, Triệt án ngữ hay nhiều sao mờ ám xấu xa
    page: 105
    priority: 0
    meaning:
      Suốt đời chẳng mấy khi xứng ý toại lòng, công danh trắc trở; nếu được giàu
      sang cũng chẳng lâu bền; thường có bệnh tật ở đầu, hay mắc tai họa khủng khiếp
      (đao thương, súng đạn), và không sống lâu.
    evidence:
