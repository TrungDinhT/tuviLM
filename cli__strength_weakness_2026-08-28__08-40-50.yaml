        bản chất vấn đề.
      nang_luc: Phân tích vấn đề
    diem_yeu:
    - ten: Khó duy trì nhịp độ bền bỉ
      loai: han_che_truc_tiep
      mo_ta: Bạn thường bắt đầu công việc với sự siêng năng và nhiệt tình rõ rệt, nhưng khi thời gian
        kéo dài hoặc khi sự mới mẻ ban đầu phai nhạt, nhịp độ làm việc giảm dần và có xu hướng bỏ dở những
        gì đã khởi động. Đây không phải là vấn đề thiếu năng lực mà là khó giữ mức năng lượng đều đặn—bạn
        dễ bùng lên rồi hụt hơi, đặc biệt với những mục tiêu dài hạn đòi hỏi sự lặp lại hoặc chờ đợi kết
        quả chậm.
      giai_thich: 'Thái Dương hãm địa tại Mệnh được Tân Biên mô tả là ''không cương nghị, không bền chí.''
        Phú giải ''Nhật tại Mùi, Thân, Mệnh vị, vi nhân tiên cần hậu lận'' (siêng năng buổi đầu, rồi lười
        biếng trễ nải và bỏ dở) tuy nói về vị trí Mùi-Thân nhưng phản ánh đúng bản chất của Nhật hãm:
        năng lượng ban đầu có nhưng không duy trì được. Tả-Hữu tuy cho sự siêng năng (nữ mệnh ''siêng
        năng, hiền hậu''), nhưng khi Nhật hãm là gốc Mệnh, xung lực nền tảng vẫn thiếu độ bền. Thái Âm
        hãm tại Thiên Di (Thìn) xung chiếu cũng ở trạng thái ''kém sáng suốt, phát tán suy bại,'' không
        cung cấp đủ lực đẩy bổ sung cho Mệnh.'
    - ten: Cảm xúc chi phối phán đoán
      loai: qua_da
      mo_ta: Bạn là người đa sầu đa cảm, dễ bị tác động bởi tâm trạng và cảm xúc khi đưa ra nhận định
        hoặc quyết định. Sự nhạy cảm này giúp bạn thấu hiểu người khác và có chiều sâu nội tâm, nhưng
        khi cảm xúc dâng cao—đặc biệt trong môi trường xa lạ hoặc khi đối mặt với xung đột—nó có thể làm
        mờ khả năng xét đoán sáng suốt vốn có, dẫn đến những phản ứng hoặc đánh giá thiếu chính xác mà
        sau này bạn tự nhận ra.
      giai_thich: Thái Dương hãm địa nữ mệnh được Tân Biên ghi rõ là 'đa sầu, đa cảm.' Bản thân Nhật hãm
        đã 'kém thông minh, hay nhầm lẫn' so với khi miếu vượng—không phải thiếu trí tuệ mà là ánh sáng
        lý trí bị che mờ bởi lớp sương cảm xúc. Thái Âm hãm tại Thiên Di (Thìn) cũng ở trạng thái 'kém
        sáng suốt, hay nhầm lẫn,' và khi ra ngoài giao thiệp thì 'hay gặp tai ương vì những sự phiền lòng,
        nhiều người ghét.' Cả Nhật lẫn Nguyệt đều hãm địa trong lá số này, tạo nên một lớp nền cảm xúc
        dày có thể lấn át tính xét đoán. Cự Môn vượng tại Thân tuy có 'trí xét đoán sáng suốt' nhưng chỉ
        phát huy khi bạn kích hoạt được trục Thân—tức là qua giai đoạn đầu đời hoặc khi đủ bình tĩnh để
        vận dụng năng lực ngôn ngữ và phân tích.
    - ten: Năng lực ẩn tàng khó phát lộ
      loai: xung_dot
      mo_ta: Bạn sở hữu nhiều năng lực thực chất—tranh biện, phân tích, ứng biến—nhưng chúng thường không
        được thể hiện trọn vẹn ra bên ngoài hoặc không được môi trường xung quanh ghi nhận đúng mức. Có
        một khoảng cách giữa những gì bạn biết mình có thể làm và những gì thực sự được triển khai trong
        đời sống. Điều này không hẳn do thiếu cơ hội mà do sự kết hợp giữa xu hướng không duy trì đủ lâu
        để năng lực chín muồi và hoàn cảnh thiếu chất xúc tác cần thiết.
      giai_thich: 'Cự Môn vượng địa tại Ngọ được ví như ''ngọc giấu trong đá''—tân Biên nhấn mạnh rằng
        ở vị trí Tý-Ngọ, Cự Môn cần Hóa Lộc đồng cung hoặc Tuần/Triệt án ngữ để ngọc lộ ra ngoài. Trong
        lá số này, Cự Môn đồng cung với Lộc Tồn nhưng không có Hóa Lộc hay Tuần/Triệt, nên Tân Biên ghi
        nhận ''chẳng khác gì ngọc chìm sâu trong đá—đa học, đa năng nhưng không gặp thời.'' Xung đột nằm
        ở chỗ: năng lực phân tích và ngôn ngữ có thật (Cự Môn vượng + Tả-Hữu mưu trí + Lộc Tồn), nhưng
        cấu trúc thiếu yếu tố kích hoạt cần thiết, đồng thời Nhật hãm tại Mệnh không cung cấp đủ xung
        lực bền bỉ để tự phá lớp đá bao bọc. Đây là xung đột giữa tiềm năng bên trong và điều kiện phát
        lộ bên ngoài.'
- profile:
    name: Trang
