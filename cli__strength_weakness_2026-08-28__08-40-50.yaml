        một lĩnh vực. Khả năng này giúp bạn hiểu được những nguyên tắc cơ bản và bắt đầu vận dụng mà không
        cần quá nhiều thời gian hay sự hướng dẫn chi tiết. Tốc độ học nhanh này thể hiện rõ khi tiếp cận
        những lĩnh vực thực hành, kỹ thuật hoặc mang tính ứng dụng, tuy nhiên thường đi kèm với việc khó
        duy trì sự tập trung lâu dài để đạt mức chuyên sâu.
      giai_thich: Thiên Việt tọa thủ tại Mệnh mang lại nền tảng thông minh và khả năng tiếp thu nhanh,
        dù bị Tuần án ngữ nên mức độ bị chiết giảm phần nào. Cách cục 'Khôi Việt tại Mệnh Thân da chiết
        quế' vẫn cho thấy năng lực học tập và thi cử, dù kết quả cuối cùng có thể không như mong đợi do
        Tuần và Hóa Kỵ. Liêm Phá hãm địa có tính 'khéo tay' - một dạng học nhanh qua thực hành và bắt
        chước. Cách cục 'biết nhiều nghề' cũng gián tiếp cho thấy khả năng nắm bắt nhanh nhiều lĩnh vực
        khác nhau.
      nang_luc: Học nhanh
    diem_yeu:
    - ten: Khó theo việc đến cùng ở mức tinh thục
      loai: han_che_truc_tiep
      mo_ta: Bạn thường gặp khó khăn trong việc theo đuổi một công việc đến mức tinh thục hoặc đến điểm
        kết thúc trọn vẹn. Xu hướng này thể hiện qua việc dễ bắt đầu nhiều thứ nhưng khó duy trì sự tập
        trung đủ lâu để đạt mức thành thạo, hoặc dễ chuyển hướng khi chưa hoàn tất. Đây là một hạn chế
        ổn định, ảnh hưởng đến nhiều lĩnh vực từ chuyên môn đến các dự định cá nhân, và thường khiến kết
        quả cuối cùng không tương xứng với tiềm năng ban đầu.
      giai_thich: Cách cục 'Thất Sát Phá Quân nghi xuất ngoại, chư ban thủ nghệ bất năng tinh' trực tiếp
        nói lên việc 'biết nhiều nghề nhưng không được tinh thục' - đây là trục chính của hạn chế này.
        Liêm Trinh và Phá Quân đều hãm địa ở Mệnh, chủ về sự vất vả, bôn ba và khó ổn định trên một con
        đường. Hóa Kỵ thủ Mệnh gây thêm sự nhầm lẫn và dang dở. Tài Bạch có Tử Vi và Thất Sát miếu địa
        nhưng bị Triệt án ngữ, làm giảm khả năng tích lũy bền vững - phản ánh việc khó duy trì kết quả
        lâu dài. Thiên Tướng hãm ở Thân 'suốt đời chẳng mấy khi được xứng ý toại lòng'.
    - ten: Kiểm soát xung động kém
      loai: han_che_truc_tiep
      mo_ta: Bạn dễ để những thôi thúc tức thời dẫn đến hành động mà chưa kịp cân nhắc kỹ lưỡng. Khi đối
        diện với một tình huống, bạn có xu hướng phản ứng nhanh và mạnh, đôi khi bỏ qua bước suy xét các
        hệ quả có thể xảy ra. Biểu hiện này nổi trội trong các quyết định quan trọng hoặc khi chịu áp
        lực, và có thể dẫn đến những hậu quả không mong muốn hoặc phải trả giá cho sự vội vàng.
      giai_thich: Phá Quân hãm địa ở Mệnh chủ về 'liều lĩnh, hung tợn', thiếu sự suy xét cẩn thận. Thiên
        Tướng hãm ở cung Thân (Thiên Di) cũng 'trước khi làm bất cứ việc gì cũng không biết suy xét cẩn
        thận, nên hay nhầm lẫn suốt đời lao khổ'. Hóa Kỵ thủ Mệnh trực tiếp gây 'tính nông nổi, hay nhầm
        lẫn'. Liêm Trinh hãm địa thêm tính 'khắc nghiệt', càng đẩy mạnh xu hướng phản ứng thiếu kiểm soát.
        Tuần tại Mệnh có phần giảm bớt nhưng không đủ để triệt tiêu hoàn toàn, đặc biệt khi Hỏa Tinh từ
        Tài Bạch chiếu về tạo thêm sự nóng vội.
    - ten: Duy trì tập trung kém bền
      loai: han_che_truc_tiep
      mo_ta: Bạn khó giữ sự chú ý vào một nhiệm vụ duy nhất trong thời gian dài, đặc biệt khi có nhiều
        yếu tố mới hoặc hấp dẫn xuất hiện. Xu hướng này khiến bạn dễ chuyển từ việc này sang việc khác,
        dẫn đến nhiều đầu việc dang dở và khó đạt được chiều sâu cần thiết trong bất kỳ lĩnh vực nào.
        Hạn chế này hiện diện ổn định và thường được kích hoạt khi công việc đòi hỏi sự kiên nhẫn hoặc
        khi phải làm những việc lặp đi lặp lại.
      giai_thich: Hóa Kỵ thủ Mệnh gây 'hay nhầm lẫn' và thiếu sự tập trung bền vững, dễ bị phân tâm bởi
        các yếu tố xung quanh. Liêm Phá hãm địa đều có tính hoạt động mạnh nhưng thiếu ổn định, dễ bị
        phân tán năng lượng qua nhiều hướng. Cách cục 'biết nhiều nghề nhưng không tinh thục' cho thấy
        sự phân tán chú ý thay vì tập trung vào một. Tuần tại Mệnh gây trắc trở và gián đoạn dòng công
        việc, làm cho việc duy trì nhịp độ liên tục trở nên khó khăn. Đào Hoa, Thiên Hỉ đồng cung cũng
        tạo thêm sự hấp dẫn với những điều mới mẻ, kéo sự chú ý ra khỏi nhiệm vụ chính.
- profile:
    name: Uyen
    birth_date: '1999-03-09'
    birth_time: 18
    gender: female
  output:
    tong_quan: 'Hồ sơ năng lực của bạn có hình thái đặc trưng bởi một lõi nội tại thiên về quản lý thận
      trọng và tư duy chiến lược, kết hợp với một lớp thể hiện bên ngoài mang tính quyết liệt, uy quyền
      và giàu sức thuyết phục. Sự kết hợp này tạo ra người vừa có chiều sâu phân tích vừa có khả năng
      hành động mạnh mẽ khi bước ra thế giới bên ngoài. Tuy nhiên, chính cấu trúc này cũng sinh ra những
      điểm nghẽn đáng kể: năng lượng hành động bị cản trở ngay từ bên trong, khả năng tổ chức dài hạn
      bị phong tỏa, và mâu thuẫn thường trực giữa hai thái cực thận trọng và quyết liệt. Năng lực chiến
      lược nổi bật nhưng cần được ý thức để không trượt sang thao túng, và khả năng diễn đạt tuy mạnh
      trong giao tiếp trực tiếp nhưng dễ sai sót khi chuyển sang văn bản hoặc giao dịch chính thức.'
    diem_manh:
    - nang_luc_id: phan_tich_van_de
      mo_ta: Khi đối mặt với một vấn đề phức tạp, bạn có thói quen tách nó thành các phần nhỏ hơn để nhận
        ra mối quan hệ giữa chúng và tìm ra điểm then chốt cần xử lý. Bạn cũng tự nhiên cân đo các mặt
        lợi hại trước khi đi đến một đánh giá, không vội vàng kết luận khi chưa xem xét đủ yếu tố. Năng
        lực này hiện diện ổn định trong nhiều bối cảnh, từ công việc đến đời sống, và đặc biệt phát huy
        khi vấn đề đòi hỏi tư duy chiến lược hơn là phản ứng tức thì.
      giai_thich: Thiên Phủ đắc địa thủ Mệnh là tài tinh chủ về quản lý và suy tính, tạo nền tảng cho
        khả năng phân tích có hệ thống. Đà La đắc địa đồng cung bổ sung chiều sâu chiến lược với tính
        chất thâm trầm và mưu cơ, giúp bạn không chỉ nhìn bề mặt mà còn truy tìm lớp nguyên nhân bên trong.
        Bộ Phủ Tướng hội chiếu củng cố tư duy quản trị tổng thể, trong khi Tang Môn mang lại sự cương
        nghị giúp bạn không né tránh những vấn đề khó. Tuy nhiên, chính Chiết Túc Mã cũng từ cấu trúc
        này khiến quá trình phân tích đôi khi bị kéo dài do sự do dự nội tại, và kết quả phân tích không
        phải lúc nào cũng chuyển hóa được thành hành động liền mạch.
      nang_luc: Phân tích vấn đề
    - nang_luc_id: quyet_doan
      mo_ta: Khi hoạt động bên ngoài hoặc trong các tình huống đòi hỏi sự quyết đoán, bạn có khả năng
        đi đến lựa chọn dứt khoát và cam kết với hướng đi đã chọn mà không kéo dài do dự. Sự quyết đoán
        này nổi trội nhất khi bạn ở trong môi trường tương tác với người khác hoặc đối mặt với tình huống
        cần sự chỉ huy. Trong bối cảnh cá nhân hoặc khi tự suy tính, bạn có thể chậm hơn do xu hướng cân
        nhắc kỹ, nhưng khi đã bước vào hành động thực tế, tốc độ và độ dứt khoát tăng lên rõ rệt.
      giai_thich: Cung Thân cư Thiên Di có Thất Sát miếu địa đồng cung Tử Vi, tạo cách Đế huề bảo kiếm
        — vua mang kiếm báu — nên khi thể hiện ra bên ngoài, bạn mang phong thái quyết liệt và uy quyền.
        Thất Sát chủ dũng tinh, ưa hành động nhanh và dứt khoát; Tử Vi bổ sung uy quyền và sự nghiêm cẩn,
        giúp quyết định không chỉ nhanh mà còn có trọng lượng. Bộ Tứ Linh và cách Hổ đội hòm sắt tại cung
        Thân gia tăng quý khí và uy danh, khiến người khác dễ tin phục. Tuy nhiên, Tử Vi bình hòa tại
        Hợi giảm bớt phần rực rỡ, nên uy lực tuy có nhưng không ở mức áp đảo tuyệt đối, và sự quyết đoán
        này phát huy tốt nhất khi có bối cảnh bên ngoài kích hoạt hơn là từ nội tại.
      nang_luc: Quyết đoán
    - nang_luc_id: thuyet_phuc
      mo_ta: Bạn có khả năng trình bày ý tưởng và lập luận theo cách khiến người khác dễ chấp nhận quan
        điểm của mình, kết hợp giữa lý lẽ có cấu trúc và phong thái tự tin. Năng lực này thể hiện rõ trong
        cả giao tiếp trực tiếp lẫn diễn đạt bằng văn bản, đặc biệt khi bạn cần bảo vệ một lập trường hoặc
        thuyết phục người khác thay đổi cách nhìn. Đây là năng lực ổn định, được hỗ trợ bởi cả tư duy
        chiến lược bên trong và khả năng biểu đạt bên ngoài.
      giai_thich: Cách Hổ đội hòm sắt tại cung Thân chủ về tài hùng biện và văn học, tạo nền tảng cho
        khả năng thuyết phục bằng lời nói. Tấu Thư đồng cung tại Thiên Di bổ sung sở trường về văn thư
        và diễn đạt có bài bản. Từ tam hợp, Văn Xương và Văn Khúc đều đắc địa tại Tài Bạch chiếu về Mệnh,
        mang lại sự linh hoạt trong ngôn ngữ và khả năng chuyển tải ý tưởng phức tạp thành dạng dễ tiếp
        nhận. Thiên Phủ thủ Mệnh với tính cách khoan hòa giúp cách trình bày không gây phản cảm, trong
        khi Đà La thâm trầm tạo chiều sâu cho lập luận. Hóa Kỵ trên Văn Khúc ở Tài Bạch có thể tạo một
        số nhầm lẫn trong giao dịch cụ thể, nhưng không làm mất đi năng lực diễn đạt tổng thể.
      nang_luc: Thuyết phục
    - nang_luc_id: giu_chuc_nang_duoi_ap_luc
      mo_ta: Khi đối mặt với áp lực hoặc tình huống căng thẳng, bạn vẫn duy trì được khả năng suy nghĩ
        và hành động ở mức hữu dụng thay vì bị tê liệt hoặc mất phương hướng. Bên ngoài bạn thể hiện sự
        điềm tĩnh và cương nghị, dù bên trong có thể vẫn có những lo lắng và ưu tư. Năng lực này phát
        huy rõ nhất trong các tình huống đòi hỏi bản lĩnh trực tiếp, và ít phát huy hơn khi áp lực kéo
        dài âm ỉ mà không có điểm kết thúc rõ ràng.
      giai_thich: Thiên Phủ thủ Mệnh mang tính cách khoan hòa, tạo lớp đệm cảm xúc giúp bạn không dễ bị
        cuốn theo hoảng loạn. Tang Môn đồng cung bổ sung sự can đảm và cương nghị, dù cũng mang theo ưu
        tư phiền muộn — nghĩa là bạn cảm nhận áp lực rõ rệt nhưng không để nó chi phối hành động. Đà La
        đắc địa với tính thâm trầm giúp giữ sự tỉnh táo để suy tính ngay cả trong hoàn cảnh khó. Khi chuyển
        sang cung Thân, Thất Sát miếu địa là dũng tinh giúp đương đầu trực tiếp với thử thách thay vì
        né tránh. Tuy nhiên, cấu trúc Tang Hổ gặp Sát tinh hội hợp cũng cảnh báo rằng nếu áp lực quá lớn
        và kéo dài, sức chịu đựng có thể bị vượt ngưỡng, đặc biệt khi liên quan đến cảm xúc cá nhân.
      nang_luc: Giữ chức năng dưới áp lực
    diem_yeu:
    - ten: Khó khởi động và duy trì đà hành động
      loai: han_che_truc_tiep
      mo_ta: Bạn thường có ý tưởng và năng lượng nhưng hay gặp trở ngại ngay khi bắt tay vào thực hiện,
        khiến mọi việc không tiến triển nhanh như mong muốn. Sự sốt ruột dễ xuất hiện, và khi bị cản trở,
        bạn có xu hướng đổi hướng thay vì kiên trì với hướng đi ban đầu. Hạn chế này hiện diện khá thường
        xuyên, đặc biệt khi bạn tự khởi xướng công việc mà không có áp lực hoặc cấu trúc bên ngoài buộc
        phải tiến lên.
      giai_thich: Chiết Túc Mã hình thành từ sự hội hợp của Đà La và Thiên Mã ngay tại cung Mệnh, tạo
        hình ảnh ngựa què — có lực nhưng đường không thông, muốn chạy mà chân bị vướng. Đà La vốn chủ
        về sự trì hoãn và xoay vòng tại chỗ, trong khi Thiên Mã là động lực di chuyển; hai sao này mâu
        thuẫn nhau ngay trong cùng một cung, tạo ra trạng thái nội tại mà ý muốn hành động luôn bị chính
        sự thận trọng và trì trệ kéo lại. Thiên Phủ thủ Mệnh tuy có mưu cơ nhưng cũng ưa sự an toàn, khiến
        bạn càng do dự trước mỗi bước đi mới. Cấu trúc này không phủ nhận năng lực phân tích hay sự quyết
        đoán khi đã vào guồng, nhưng giải thích vì sao khoảng cách từ ý định đến hành động đầu tiên thường
        dài hơn bình thường.
    - ten: Khó xây dựng và bám đuổi kế hoạch dài hạn
      loai: han_che_truc_tiep
      mo_ta: Bạn gặp khó khăn trong việc thiết lập một lộ trình dài hạn rõ ràng và bám theo nó đến cùng.
        Các kế hoạch thường bị gián đoạn, thay đổi cấu trúc hoặc mất phương hướng giữa chừng, không phải
        vì thiếu năng lực mà vì khả năng tổ chức và duy trì hệ thống bị ảnh hưởng bởi nhiều yếu tố gây
        nhiễu. Hạn chế này thể hiện rõ nhất trong những mục tiêu đòi hỏi sự kiên trì qua nhiều giai đoạn.
      giai_thich: Cung Quan Lộc tại Dậu có Thiên Tướng hãm địa, vốn đã yếu về mặt tổ chức và quản lý,
        lại chịu cả Tuần lẫn Triệt án ngữ. Thiên Tướng gặp Tuần Triệt được ví như ông tướng mất đầu, ấn
        bị sứt mẻ, mất khả năng điều phối và duy trì trật tự. Thiên Hình miếu địa đồng cung mang lại kỷ
        luật cá nhân và sự nghiêm khắc, nhưng không đủ bù đắp cho sự phong tỏa cấu trúc mà Tuần Triệt
        gây ra. Thêm vào đó, Thiên Hư, Tiểu Hao và Tuế Phá tại đây tạo xu hướng hao tán và thất bại lặp
        lại trong các nỗ lực tổ chức dài hạn. Cấu trúc này không có nghĩa bạn không thể đạt được gì, mà
        cho thấy con đường xây dựng sự nghiệp thường phải đi qua nhiều lần tái cấu trúc hơn là một lộ
        trình tuyến tính.
    - ten: Xung đột giữa thận trọng và quyết liệt
      loai: xung_dot
      mo_ta: Có một mâu thuẫn nội tại giữa phần bên trong muốn giữ an toàn, cân nhắc kỹ lưỡng và phần
        bên ngoài muốn hành động nhanh, mạnh, thậm chí liều lĩnh. Bạn có thể thấy mình rất thận trọng
        khi suy tính một mình nhưng lại trở nên rất quyết liệt khi bước ra tương tác, rồi sau đó tự hoài
        nghi về mức độ mạo hiểm của chính mình. Xung đột này tạo ra sự thiếu nhất quán trong phong cách
        và đôi khi khiến người xung quanh khó đoán được bạn sẽ phản ứng theo hướng nào.
      giai_thich: 'Mệnh có Thiên Phủ đắc địa — sao chủ về bảo tồn, tích lũy và thận trọng, mang tính cách
        khoan hòa nhân hậu và ưa sự an toàn. Trong khi đó, cung Thân cư Thiên Di có Thất Sát miếu địa
        — dũng tinh chủ về hành động nhanh, cương nghị, hiếu thắng và không ngại đối đầu. Tử Vi đồng cung
        khuếch đại cả uy quyền lẫn sự liều lĩnh của Thất Sát. Hai thái cực tồn tại song song: Mệnh là
        bản năng gốc, Thân là cách thể hiện ra thế giới và xu hướng hậu vận. Khi Mệnh và Thân kéo theo
        hai hướng khác nhau, bạn dễ rơi vào trạng thái lúc thì quá cẩn thận đến mức bỏ lỡ cơ hội, lúc
        lại quá quyết liệt đến mức không kịp cân nhắc rủi ro. Chiết Túc Mã tại Mệnh càng làm tăng sự giằng
        co này.'
    - ten: Mưu lược vượt ranh giới thành thao túng
      loai: qua_da
      mo_ta: Khả năng phân tích và xây dựng chiến lược vốn là điểm mạnh có thể bị đẩy quá xa, biến thành
        xu hướng sắp đặt tình huống hoặc dẫn dắt người khác theo hướng có lợi cho mình mà không minh bạch.
        Trong những hoàn cảnh mà lợi ích cá nhân bị đe dọa hoặc khi cảm thấy cần kiểm soát kết quả, bạn
        dễ bị cám dỗ sử dụng mưu cơ thay vì trao đổi thẳng thắn. Xu hướng này không phải bản chất mặc
        định mà xuất hiện khi áp lực hoặc bất an kích hoạt mặt tối của năng lực chiến lược.
      giai_thich: Thiên Phủ thủ Mệnh khi gặp nhiều Sát tinh hội hợp bị Tân Biên nhận định là người hay
        mưu mẹo, thiếu minh bạch. Đà La đắc địa đồng cung mang tính chất thâm trầm, có mưu cơ, thủ đoạn
        — khi tích cực thì là chiều sâu chiến lược, khi tiêu cực thì là sự tính toán ngầm. Linh Tinh từ
        Tài Bạch chiếu về Mệnh nằm trong bộ Tang Hổ Sát tinh hội hợp bổ sung yếu tố bí mật, khiến mưu
        cơ dễ chuyển sang hướng không công khai. Thiên Phủ vốn là sao quản lý kho tàng, khi kết hợp với
        Sát tinh tạo xu hướng bảo vệ lợi ích bằng mọi giá, kể cả bằng cách kiểm soát thông tin. Cấu trúc
        này cho thấy khi năng lực chiến lược bị kích hoạt bởi bất an, ranh giới giữa mưu lược chính đáng
        và thao túng trở nên mong manh.
    - ten: Sai sót trong diễn đạt và giao dịch tài chính
      loai: han_che_truc_tiep
      mo_ta: Trong các tình huống liên quan đến giao tiếp bằng văn bản, hợp đồng hoặc giao dịch tiền bạc,
        bạn dễ mắc những lỗi nhầm lẫn hoặc bỏ sót chi tiết mà bình thường ít xảy ra. Sự mơ hồ hoặc hiểu
        lầm có thể phát sinh ngay cả khi bạn tự tin về nội dung mình truyền đạt. Hạn chế này không ảnh
        hưởng đến khả năng hùng biện trực tiếp nhưng gây trở ngại trong các tình huống đòi hỏi độ chính
        xác cao về câu chữ và số liệu.
      giai_thich: 'Hóa Kỵ tọa thủ tại cung Tài Bạch trên sao Văn Khúc, tạo sự nhầm lẫn và bế tắc ngay
        trên phương tiện diễn đạt và giao dịch tài chính. Văn Khúc vốn chủ về ngôn ngữ và văn thư, khi
        bị Hóa Kỵ xâm phạm thì độ chính xác của câu chữ bị ảnh hưởng, dễ sinh hiểu lầm hoặc sai sót trong
        văn bản. Tuy Hóa Kỵ đắc địa tại Sửu nên tác hại được giảm nhẹ, nhưng tính chất hay nhầm lẫn vẫn
        hiện diện. Thiên Diêu hãm địa đồng cung bổ sung yếu tố mơ hồ và thiếu rõ ràng, trong khi Quả Tú
        tạo xu hướng giữ kín thông tin thay vì minh bạch hóa. Cấu trúc này tạo ra một điểm mù cụ thể:
        năng lực hùng biện hoạt động tốt trong giao tiếp trực tiếp, nhưng khi chuyển sang văn bản hoặc
        giao dịch chính thức, độ tin cậy giảm đi đáng kể.'
- profile:
    name: Bang
    birth_date: '2000-03-18'
    birth_time: 14
    gender: male
  output:
    tong_quan: 'Lá số của bạn có hình thái đặc trưng: năng lực nhận thức và ngôn ngữ tập trung ở tam phương
      Mệnh–Quan–Tài rất dày, đặc biệt quanh trục lập luận, tổ chức và chiều sâu tri thức. Thiên Di là
      vùng sáng nhất — khi hoạt động bên ngoài, bạn thể hiện sự linh hoạt, uy tín và khả năng thu hút
      hỗ trợ tốt hơn hẳn so với khi vận hành trong không gian cá nhân. Tuy nhiên, cung Mệnh vô chính diệu
      gặp Tuần và cách cục Lộc Tồn bị bao vây bởi Địa Không, Thái Tuế, Thiên Mã tạo nên một lớp ma sát
      thường trực: năng lực có nhưng đường triển khai hay bị gián đoạn, kết quả ít khi trọn vẹn như ý
      muốn. Cung Thân đồng cung Phúc Đức với Thái Âm Miếu đi cùng Hóa Kỵ tạo thêm một lớp phức tạp nội
      tâm — cảm xúc và sự đa nghi có thể trở thành lực cản ngầm, đặc biệt trong các mối quan hệ thân cận.
      Tổng thể, bạn là người có nền tảng tư duy vững và khả năng thích nghi tốt ở môi trường mới, nhưng
      cần ý thức quản lý nhịp độ đường dài, kiểm soát phản ứng cảm xúc và học cách chia sẻ quyền kiểm
      soát để năng lực không bị chính cấu trúc nội tại kìm hãm.'
    diem_manh:
    - nang_luc_id: lap_luan_bang_loi
      mo_ta: Bạn có khả năng trình bày chuỗi lý lẽ sắc bén, đanh thép và có sức thuyết phục trong giao
        tiếp công việc. Khi cần bảo vệ quan điểm hoặc phân tích một vấn đề trước người khác, bạn thường
        tìm được cách diễn đạt vừa logic vừa có trọng lượng, khiến người nghe phải cân nhắc. Năng lực
        này nổi trội và ổn định, phát huy mạnh nhất trong bối cảnh nghề nghiệp, thảo luận chuyên môn hoặc
        khi cần trình bày trước tập thể; trong đời sống cá nhân nó có thể bớt rõ do xu hướng giữ khoảng
        cách.
      giai_thich: Cự Môn vượng địa tại Quan Lộc cung ở Tý là nền tảng chính — sách Tân Biên mô tả Cự Môn
        vượng tại Tý là 'ăn nói đanh thép, có nhiều tài năng nhất là ăn nói và tổ chức, sẵn mưu trí, văn
        võ kiêm toàn.' Bạch Hổ đồng cung tăng thêm tính nghiêm nghị và sức nặng trong lời nói, trong khi
        Tướng Quân mang đến dáng dấp quyết đoán, chỉ huy khi biểu đạt. Thái Dương vượng địa tại Tài Bạch
        góp phần tạo độ sáng cho tư duy, giúp lập luận không chỉ đanh thép mà còn có chiều rộng. Toàn
        bộ tam hợp Mệnh–Quan–Tài hỗ trợ nhau khiến năng lực ngôn ngữ trở thành một trong những điểm nổi
        bật nhất của lá số.
      nang_luc: Lập luận bằng lời
    - nang_luc_id: cau_truc_hoa
      mo_ta: Bạn có năng lực tự nhiên trong việc biến những thông tin hoặc công việc rời rạc thành một
        hệ thống có trật tự, phân chia rõ ràng các phần và xác định được mối quan hệ giữa chúng. Khi đối
        diện với một bài toán phức tạp, bạn thường là người đầu tiên nhìn ra cách sắp xếp hợp lý và đề
        xuất quy trình thực hiện. Năng lực này hiện diện ổn định ở cả tư duy lẫn hành động, phát huy tốt
        trong công việc đòi hỏi quy hoạch hoặc xây dựng hệ thống, tuy có thể bị gián đoạn khi cảm xúc
        cá nhân xen vào.
      giai_thich: 'Lộc Tồn tại Mệnh, dù nằm trong cách cục bất lợi, vẫn giữ đặc tính cốt lõi được Tân
        Biên ghi nhận: ''thông minh, có tài tổ chức, có nhiều sáng kiến lạ và biết ứng biến.'' Cự Môn
        tại Quan Lộc củng cố thêm phương diện tổ chức trong sự nghiệp. Quốc Ấn tại Tài Bạch mang dấu ấn
        của sự sắp xếp mang tính chính thức, có quy phạm. Sự kết hợp này tạo nên khuynh hướng tự nhiên:
        khi tiếp cận bất kỳ vấn đề nào, bạn có xu hướng phân lớp và tạo cấu trúc trước khi hành động,
        thay vì ứng phó ngẫu hứng.'
      nang_luc: Cấu trúc hóa
    - nang_luc_id: thich_nghi_voi_hoan_canh
      mo_ta: Khi rời khỏi vùng an toàn hoặc bước vào môi trường mới, bạn thể hiện sự linh hoạt đáng kể
        — điều chỉnh cách làm, cách giao tiếp và kỳ vọng theo điều kiện thực tế mà không mất phương hướng.
        Bạn dễ được người xung quanh tín nhiệm và thường gặp sự hỗ trợ đúng lúc từ những người có vị thế
        hoặc kinh nghiệm. Năng lực thích nghi này phát huy mạnh nhất ở bối cảnh bên ngoài — đi xa, thay
        đổi môi trường làm việc, hoặc tiếp xúc với nhóm người mới — và tỏ ra vượt trội so với khả năng
        vận hành trong không gian quen thuộc.
      giai_thich: Thiên Di cung là vùng sáng nhất của lá số với Thiên Đồng Miếu địa và Thiên Lương vượng
        địa đồng cung tại Dần, lại thêm Hóa Khoa. Thiên Đồng chủ 'canh cải' — khả năng thay đổi và thích
        ứng là bản chất của sao này. Thiên Lương 'có mưu cơ, biết quyền biến' bổ sung chiều sâu chiến
        lược cho sự thích nghi. Hóa Khoa tại Thiên Di được Tân Biên ghi 'thông minh, lịch lãm, uyên bác,
        ra ngoài có danh giá, được nhiều người kính trọng.' Thiên Việt và Thiên Mã đồng cung tạo thêm
        yếu tố quý nhân phù trợ và khả năng di chuyển linh hoạt. Toàn bộ cung Thiên Di xung chiếu Mệnh,
        chiếu cả Phúc Đức (cung Thân), khiến năng lực thích nghi trở thành lợi thế lớn nhất khi bạn hoạt
        động bên ngoài.
      nang_luc: Thích nghi với hoàn cảnh
    - nang_luc_id: nghien_cuu_chuyen_sau
      mo_ta: Bạn có khuynh hướng tìm hiểu một lĩnh vực đến mức chuyên sâu thay vì chỉ nắm bề mặt. Khi
        đã quan tâm đến một chủ đề, bạn duy trì việc đọc, phân tích và tích lũy kiến thức một cách có
        hệ thống, dần dần xây dựng được nền tảng hiểu biết dày và chắc. Năng lực này phát huy trong những
        bối cảnh cho phép làm việc độc lập và đào sâu — nghiên cứu, phân tích, tư vấn chuyên môn — hơn
        là trong các vai trò đòi hỏi phản ứng nhanh hoặc xoay chuyển liên tục.
      giai_thich: 'Hóa Khoa tại Thiên Di mang đặc tính ''uyên bác, được tôn là thần giám sát thi cử, chấp
        chưởng văn bài'' — đây là sao chủ về chiều sâu tri thức và sự công nhận học thuật. Lộc Tồn tại
        Mệnh có đặc tính ''hiếu học, thông minh'' ngay cả khi bị cách cục xấu bao vây. Cự Môn tại Quan
        Lộc ''văn võ kiêm toàn'' cho thấy khả năng tiếp cận vấn đề từ nhiều góc độ. Hoa Cái tại Tài Bạch
        là sao chủ về sự uyên thâm, đôi khi mang tính cô độc trong nghiên cứu. Sự phối hợp giữa các sao
        này tạo nên một profile học thuật rõ nét: bạn không chỉ tiếp thu nhanh mà còn có xu hướng đào
        sâu đến khi chạm được bản chất vấn đề.'
      nang_luc: Nghiên cứu chuyên sâu
    diem_yeu:
    - ten: Khó duy trì đà tiến liên tục
      loai: han_che_truc_tiep
      mo_ta: Dù có năng lực và sáng kiến, bạn thường gặp những trở ngại lặp đi lặp lại khiến công việc
        khó giữ được đà phát triển ổn định. Có những giai đoạn mọi thứ tưởng như đã vào guồng thì lại
        xuất hiện yếu tố gây gián đoạn — từ hoàn cảnh bên ngoài đến những vướng mắc nội tại — khiến bạn
        phải dừng lại xử lý thay vì tiến tiếp. Biểu hiện này hiện diện xuyên suốt và không giới hạn ở
        một lĩnh vực cụ thể; nó rõ nhất khi bạn theo đuổi các mục tiêu dài hạn đòi hỏi sự kiên trì qua
        nhiều giai đoạn.
      giai_thich: Cách cục 'Lộc đáo Mã đáo kỵ Kiếp Không Tuế' được phát hiện khi Lộc Tồn tại Mệnh gặp
        Thiên Mã ở Thiên Di xung chiếu, lại thêm Địa Không hãm địa và Thái Tuế tại Tài Bạch trong tam
        hợp. Tân Biên ghi nhận cách này tạo pattern 'suốt đời chẳng mấy khi xứng ý toại lòng, công danh
        trắc trở, hay phải lo lắng về sinh kế.' Tuần án ngữ tại Mệnh vô chính diệu gia tăng cảm giác bị
        kìm hãm, khiến năng lực khó bung ra liền mạch. Địa Không hãm tại Tài Bạch mang tính 'phá tán,
        hay gây tai họa' trực tiếp phá vỡ sự ổn định của dòng tài chính và tiến trình công việc. Đây không
        phải là thiếu năng lực mà là cấu trúc tạo ra lực ma sát thường trực trên đường triển khai.
    - ten: Phản ứng cảm xúc thiếu ổn định ở vùng cá nhân
      loai: han_che_truc_tiep
      mo_ta: 'Trong công việc và giao tiếp bên ngoài, bạn thường giữ được sự điềm tĩnh và lý trí. Nhưng
        khi đụng đến các vấn đề cá nhân — gia đình, tình cảm, hoặc những gì chạm vào vùng bất an sâu —
        phản ứng cảm xúc có thể vượt khỏi mức kiểm soát thông thường: suy diễn quá mức, nghi ngờ không
        có cơ sở rõ ràng, hoặc để sự bất an chi phối quyết định. Biểu hiện này không thường xuyên nhưng
        có cường độ đáng kể khi xuất hiện, và thường đi kèm cảm giác trống rỗng hoặc bất an kéo dài sau
        đó.'
      giai_thich: Hóa Kỵ tại Phúc Đức — cung cũng là cung Thân — đi cùng Thái Âm Miếu địa là cấu trúc
        then chốt. Hóa Kỵ mang đặc tính 'độc hiểm, ích kỷ, hay ghen ghét, hay nhầm lẫn, gây thị phi' và
        khi đóng tại Phúc Đức, sách ghi 'giảm thọ, họ hàng ly tán, hay tranh chấp lẫn nhau.' Thái Âm vốn
        là sao chủ về cảm xúc và nội tâm, khi kết hợp với Kỵ tạo nên lớp cảm xúc phức tạp khó kiểm soát.
        Thiên Hư đồng cung mang cảm giác hư không, bất an nội tại; Tuế Phá tạo sự phá vỡ, bất ổn trong
        đời sống tinh thần. Mặc dù Hóa Kỵ đắc địa tại Tuất nên 'đỡ lo ngại' so với hãm địa, ảnh hưởng
        vẫn đủ mạnh để tạo ra một vùng dễ tổn thương — đặc biệt vì cung Thân chi phối giai đoạn sau của
        cuộc đời, khi các vấn đề nội tâm thường trở nên rõ nét hơn.
    - ten: Giữ quyền kiểm soát quá chặt
      loai: qua_da
      mo_ta: 'Bạn có xu hướng muốn tự mình nắm và xử lý mọi việc thay vì chia sẻ hoặc giao phó cho người
        khác, ngay cả khi khối lượng công việc vượt quá khả năng một người. Điều này không xuất phát từ
        thiếu tin tưởng cụ thể vào ai đó mà là một phản xạ phòng thủ tự nhiên: giữ chặt nguồn lực, thông
        tin và quyền quyết định trong tầm tay mình. Biểu hiện này trở nên rõ hơn khi bạn cảm thấy áp lực
        hoặc bất an, và có thể vô tình giới hạn quy mô những gì bạn đạt được vì không tận dụng được nguồn
        lực tập thể.'
      giai_thich: 'Lộc Tồn tại Mệnh trong cách cục xấu được Tân Biên mô tả trực tiếp: ''người biển lận,
        ích kỷ'' — đây là mặt tối của sao vốn chủ về tài lộc và sự giữ gìn. Khi Lộc Tồn không được các
        sao sáng sủa hỗ trợ mà bị vây bởi Địa Không, Thái Tuế và các sao mờ ám, đặc tính ''giữ của'' bị
        đẩy sang cực đoan: không chỉ giữ tài sản mà còn giữ quyền kiểm soát, thông tin và không gian quyết
        định. Tuần tại Mệnh gia tăng tính co cụm, phòng thủ. Cấu trúc này tương phản rõ với năng lực thích
        nghi và giao tiếp bên ngoài (Thiên Di sáng), tạo nên nghịch lý: bạn có thể rất cởi mở và linh
        hoạt với người ngoài nhưng lại khép chặt quyền kiểm soát trong không gian riêng và các mối quan
        hệ thân cận.'
