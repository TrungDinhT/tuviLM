  output:
    tong_quan: 'Hồ sơ năng lực của bạn được định hình bởi trục Mệnh–Thân nối Vũ Khúc miếu địa (tổ chức,
      quyết đoán, thực tế) với Phá Quân miếu địa ở cung Thân (phá cũ lập mới, hành động quyết liệt), trên
      nền nhiều sát tinh hội hợp tạo ra cường độ cao và nhịp biến động mạnh. Điểm mạnh nổi bật nằm ở khả
      năng cấu trúc hóa nguồn lực, phán đoán tình huống bằng sự sắc sảo thực tiễn, và đặc biệt là năng
      lực bứt phá khi hoàn cảnh bất ổn – chính nơi người khác chao đảo lại là lúc bạn phát huy tốt nhất.
      Tuy nhiên, cùng những cấu trúc ấy cũng tạo ra mặt trái: nhịp độ thành–bại thất thường, xu hướng
      hành động quá nhanh khi bị kích thích, giao tiếp thẳng đến mức thiếu linh hoạt, và phản ứng cảm
      xúc dễ lấn át khi áp lực kéo dài. Tứ Hóa phân tán (Lộc ở Thiên Di, Quyền ở Nô Bộc, Khoa ở Tử Tức,
      Kỵ ở Điền Trạch) cho thấy năng lực của bạn tỏa ra nhiều hướng nhưng trọng tâm nằm ở tương tác bên
      ngoài và hành động thực tế hơn là duy trì ổn định nội bộ.'
    diem_manh:
    - nang_luc_id: cau_truc_hoa
      mo_ta: 'Bạn có khả năng tự nhiên trong việc biến các nguồn lực, công việc hoặc thông tin rời rạc
        thành một cấu trúc rõ ràng, có trật tự và vận hành được. Đây không phải là kỹ năng học được qua
        đào tạo mà là cách bạn tiếp cận vấn đề: khi đối diện một mớ hỗn độn, bạn nhanh chóng nhìn ra các
