    diem_manh:
    - nang_luc_id: khoi_dong_hanh_dong
      mo_ta: Bạn dễ bắt tay vào việc thay vì chần chừ hay chờ đợi điều kiện hoàn hảo. Khi có ý định hoặc
        cơ hội, bạn thường hành động ngay, sẵn sàng thử nghiệm và không ngại thay đổi môi trường hay lĩnh
        vực hoạt động. Xu hướng này nổi trội và ổn định, thể hiện ở cả công việc chuyên môn lẫn các quyết
        định đời sống cá nhân, đặc biệt khi có yếu tố mới hoặc khi cần rời khỏi vùng an toàn.
