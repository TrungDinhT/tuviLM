        mạnh, thích đi xa và không chịu ngồi yên. Phá Quân hãm chủ về 'chuyên về kỹ nghệ, máy móc, thủ
        công hay đi buôn', Liêm Trinh hãm cũng 'chuyên về kỹ nghệ, máy móc hay thủ công'. Thân cư Thiên
        Di với Thiên Tướng củng cố xu hướng hoạt động bên ngoài. Quan Lộc có Vũ Khúc và Tham Lang miếu
        địa chủ về doanh thương, tạo động lực hành động trong lĩnh vực kinh doanh. Cách cục 'Thất Sát
        Phá Quân nghi xuất ngoại' cho thấy việc rời bỏ môi trường quen thuộc để bắt đầu ở nơi khác là
        bản năng tự nhiên, không cần nhiều động lực bên ngoài.
      nang_luc: Khởi động hành động
    - nang_luc_id: thich_nghi_voi_hoan_canh
      mo_ta: Bạn có khả năng thích nghi nhanh với nhiều hoàn cảnh và loại công việc khác nhau. Khi môi
        trường thay đổi hoặc yêu cầu mới xuất hiện, bạn không mất quá nhiều thời gian để điều chỉnh cách
        làm và tìm được chỗ đứng. Khả năng này phát huy rộng trong nhiều bối cảnh, từ công việc kỹ thuật,
        thủ công đến kinh doanh buôn bán, tuy nhiên nó có xu hướng thiên về thích nghi bề mặt hơn là đi
        sâu vào một lĩnh vực duy nhất.
      giai_thich: Cách cục 'Thất Sát Phá Quân nghi xuất ngoại, chư ban thủ nghệ bất năng tinh' trực tiếp
