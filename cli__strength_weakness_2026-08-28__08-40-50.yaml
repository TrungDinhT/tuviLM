        lời giải bề mặt mà muốn hiểu cơ chế vận hành bên dưới. Năng lực này phát huy rõ nhất trong công
        việc đòi hỏi lập kế hoạch, tham mưu hoặc xử lý tình huống có nhiều yếu tố đan xen, nhưng có thể
        chậm lại khi vấn đề liên quan đến cảm xúc hoặc giá trị cá nhân.
      giai_thich: 'Thiên Cơ miếu địa tại Quan Lộc là sao chủ mưu cơ — khả năng tư duy chiến lược, phân
        tích và hoạch định. Khi kết hợp với Cự Môn miếu địa mang tư duy phản biện và khả năng xem xét
        nhiều mặt, tạo thành năng lực phân tích có chiều sâu: không chỉ tách vấn đề mà còn đánh giá được
        các khía cạnh và lập luận về chúng. Văn Khúc tại Mệnh hỗ trợ bằng trực giác và khả năng nhận diện
        pattern từ thông tin rời rạc. Thiên Lương từ Thiên Di xung chiếu, dù hãm địa, vẫn đóng vai trò
        Ấm tinh tạo khuynh hướng tìm hiểu bản chất và bảo vệ kết luận bằng lý lẽ có căn cứ, phù hợp với
        cách Ấm Phúc tại Mệnh án ngữ bất pha tai ương.'
      nang_luc: Phân tích vấn đề
    diem_yeu:
    - ten: Thiếu bền chí và quyết đoán
      loai: han_che_truc_tiep
      mo_ta: Bạn thường do dự khi phải chốt một hướng đi, và ngay cả khi đã quyết định, bạn dễ thay đổi
        ý định sau một thời gian ngắn. Sự do dự này không đến từ thiếu hiểu biết — bạn thường đã phân
        tích kỹ — mà từ bản năng muốn giữ mọi khả năng mở. Trong công việc dài hạn, bạn có xu hướng chóng
        chán, chuyển sang hướng mới hoặc bỏ dở khi chưa đến điểm kết thúc. Biểu hiện này hiện diện ổn
        định qua các giai đoạn và mạnh lên khi bạn bị ép vào khuôn khổ cố định quá lâu.
      giai_thich: Thiên Đồng đắc địa tại Hợi, dù được nhiều cát tinh nâng đỡ, vẫn giữ bản chất không quả
        quyết, không bền chí, hay thay đổi ý kiến và công việc theo mô tả của Tân Biên. Phú giải Thiên
        Đồng nhập Mệnh hoán cải vô thường khẳng định đây là đặc tính cốt lõi chứ không phải khiếm khuyết
        ngoại vi. Cung Thân cư Phúc Đức có Triệt án ngữ trong khi nhiều sao sáng sủa như Nhật Nguyệt đồng
        cung, Thiên Khôi và Hóa Quyền tụ tập — theo quy tắc nhiều sao sáng sủa tốt đẹp gặp Triệt thì suốt
        đời chẳng được xứng ý toại lòng — tạo ra lớp cản trở cấu trúc khiến những ý định tốt đẹp khó được
        hiện thực hóa trọn vẹn. Sự kết hợp giữa bản chất hay thay đổi của Thiên Đồng và lớp cản của Triệt
        trên cung Thân khiến việc duy trì cam kết dài hạn trở thành thách thức cố hữu.
    - ten: Phân tích quá đà dẫn đến bế tắc
      loai: qua_da
      mo_ta: 'Năng lực phân tích mạnh đôi khi trở thành cái bẫy: bạn có xu hướng suy xét quá nhiều khả
        năng, lật đi lật lại vấn đề đến mức mất phương hướng hoặc không thể chốt được kết luận. Trong
        công việc, điều này biểu hiện qua việc dành quá nhiều thời gian cho giai đoạn chuẩn bị, hoặc thay
        đổi phương án liên tục vì luôn thấy điểm chưa ổn ở phương án hiện tại. Biểu hiện này rõ nhất khi
        bạn đối mặt với quyết định nghề nghiệp quan trọng hoặc khi làm việc trong môi trường có nhiều
        thông tin mâu thuẫn.'
      giai_thich: 'Thiên Cơ miếu địa tại Quan Lộc vốn tạo năng lực tư duy chiến lược sắc bén, nhưng Hóa
        Kỵ đồng cung trên Thiên Cơ tạo ra hiện tượng hay nhầm lẫn. Theo Tân Biên, Hóa Kỵ mang tính độc
        hiểm, hay ghen ghét, hay nhầm lẫn, gây thị phi. Khi Hóa Kỵ tác động lên Thiên Cơ — sao chủ mưu
        cơ và sự sáng suốt — nó không triệt tiêu năng lực phân tích mà làm méo quá trình vận hành: bạn
        vẫn phân tích sâu nhưng dễ rơi vào vòng lặp tự nghi ngờ, nhìn thấy quá nhiều rủi ro hoặc khả năng
        thay thế đến mức không thể cam kết với bất kỳ phương án nào. Cung Quan Lộc là tam hợp Mệnh nên
        ảnh hưởng này tác động trực tiếp lên cách bạn hành động và xây dựng sự nghiệp. Hóa Kỵ tại Mão
        không ở vị trí đắc địa nên tác động tiêu cực không bị chiết giảm.'
    - ten: Xung đột giữa linh hoạt và kiểm soát
      loai: xung_dot
      mo_ta: 'Bên trong bạn tồn tại hai khuynh hướng kéo ngược chiều: một bên là bản năng muốn giữ mọi
        thứ linh hoạt, không cam kết, đi theo dòng chảy; bên kia là nhu cầu kiểm soát cảm xúc và định
        hình kết quả theo ý mình. Sự giằng co này tạo ra những giai đoạn bạn bất ngờ trở nên quyết liệt
        và áp đặt, xen kẽ với những giai đoạn buông xuôi hoặc thay đổi hướng đi đột ngột. Người xung quanh
        có thể thấy bạn khó đoán — lúc thì rất dễ thích nghi, lúc lại rất cứng rắn về một điều gì đó.'
      giai_thich: 'Mệnh có Thiên Đồng đắc địa — sao chủ sự thay đổi, khoan hòa, trung hậu nhưng thất thường.
        Cung Thân cư Phúc Đức có Hóa Quyền trên Thái Âm, tạo ra nhu cầu kiểm soát và uy quyền trong thế
        giới nội tâm. Hóa Quyền là sao chủ quyền lực và sự áp đặt, khi đóng trên Thái Âm tại cung Thân,
        nó tạo ra một lớp tính cách phát triển theo thời gian: càng về sau bạn càng muốn nắm quyền kiểm
        soát cảm xúc và định hình môi trường xung quanh. Tuy nhiên, Triệt đồng cung tại Phúc Đức tạo ra
        sự gián đoạn — quyền lực nội tâm này không được biểu hiện mượt mà mà bị ngắt quãng, tạo ra những
        bùng nổ kiểm soát xen kẽ với những giai đoạn mất phương hướng. Mệnh và Thân kéo hai hướng khác
        nhau: Mệnh muốn chảy, Thân muốn nắm, và Triệt làm cả hai phía đều khó đạt được trạng thái ổn định
        bền vững.'
