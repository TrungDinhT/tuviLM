results:
- profile:
    name: Khanh
    birth_date: '1998-04-04'
    birth_time: 8
    gender: male
  output:
    tong_quan: 'Lá số có cấu trúc "nghịch cảnh tạo nội lực": Mệnh Thái Dương hãm tại Tý được Triệt cứu
      thành phản vi kỳ cách, kết hợp với Thiên Lương miếu chiếu từ Thiên Di và bộ cát tinh Tả-Hữu-Xương-Khúc
      hội hợp, tạo nên chiều sâu tư duy triết học, khả năng đào sâu vấn đề và sức phục hồi đáng kể sau
      biến cố. Tuy nhiên, toàn bộ tam phương tứ chính bị Kình-Đà hiệp, Quan Lộc có Cự Môn hãm kèm Đà La,
      Phúc Đức có Thiên Cơ hãm nhận Hóa Kỵ, và cung Thân vô chính tinh lại gặp Tuần cùng cách Tử Mã, tạo
      nên mô hình hành động chậm, phân tích dễ quá đà, và biểu đạt trí tuệ bị trở ngại. Điểm mạnh nổi
      bật nằm ở chiều sâu nhận thức và sức bền nội tại; điểm yếu tập trung ở khâu chuyển hóa từ suy nghĩ
      sang quyết định và hành động cụ thể.'
    diem_manh:
    - nang_luc_id: dao_sau_van_de
      mo_ta: Bạn có xu hướng tự nhiên không dừng ở lời giải bề mặt mà tiếp tục truy xét, đặt câu hỏi cho
        đến khi chạm được bản chất hoặc lớp nguyên nhân sâu hơn. Đây là một trong những năng lực nổi trội
        và ổn định nhất ở bạn, thể hiện qua hầu hết các bối cảnh từ học tập, công việc đến suy tư cá nhân.
        Nó đặc biệt mạnh khi bạn đối diện với những vấn đề phức tạp hoặc có chiều sâu triết học, nhưng
        có thể trở nên quá đà trong những tình huống cần chốt nhanh.
      giai_thich: Thái Dương hãm tại Tý tạo nền tảng "ham chuộng văn chương, triết học, đạo lý" theo cách
        cục Nhật hãm Hợi Tý – một xu hướng tìm kiếm ý nghĩa sâu xa tự nhiên chứ không phải thói quen phân
        tích bề mặt. Cự Môn tại Quan Lộc mang năng lực phân tích, chất vấn và truy tìm bản chất sự việc.
        Thiên Cơ tại Phúc Đức nhận Hóa Kỵ tạo thêm lớp "không buông" – tâm trí tiếp tục đào sâu ngay cả
        khi đã có câu trả lời tạm thời, biến hoạt động tư duy thành quá trình truy xét liên tục. Thiên
        Lương miếu địa chiếu Mệnh từ Thiên Di cung cấp trí tuệ để nhận ra đâu là lớp sâu thực sự đáng
        đào, giúp năng lực này có định hướng chứ không chỉ là phân tích lan man.
      nang_luc: Đào sâu vấn đề
    - nang_luc_id: phuc_hoi_sau_kho_khan
      mo_ta: Sau những giai đoạn bị setbacks nặng, biến cố hoặc mất phương hướng, bạn có khả năng trở
        lại trạng thái hữu dụng và thường tìm được hướng đi mới có ý nghĩa hơn trước. Năng lực này nổi
        trội ở chỗ bạn không chỉ hồi phục thụ động mà thường biến chính nghịch cảnh thành bước ngoặt phát
        triển. Nó thể hiện rõ nhất ở những giai đoạn chuyển tiếp lớn trong đời, khi môi trường ban đầu
        hoặc xuất phát điểm gặp trở ngại nghiêm trọng.
      giai_thich: 'Cách cục "Nhật hãm gặp Tuần Triệt án ngữ lại thành sáng sủa tốt đẹp" là pattern phản
        vi kỳ cách: chính sự "cắt" mạnh của Triệt lên Thái Dương hãm tạo ra bước ngoặt, biến bóng tối
        thành ánh sáng – nghịch cảnh không đánh gục mà ngược lại trở thành xúc tác chuyển hóa. Thiên Lương
        miếu địa chiếu Mệnh từ Thiên Di, lại gặp Tả Phù, Văn Xương, Văn Khúc, Hữu Bật hội hợp tạo thành
        cách "Thiên Lương thủ chiếu, cát tương phùng" – lớp đệm phúc đức giúp người này không bị đánh
        gục hoàn toàn bởi biến cố và luôn có trí tuệ để nhìn ra hướng đi mới. Sự kết hợp giữa Triệt (cắt
        mạnh, tạo bước ngoặt) và Thiên Lương (phúc, bền, che chở) tạo nên pattern "từ đổ vỡ mà tái sinh"
        chứ không chỉ là sự hồi phục thông thường.'
      nang_luc: Phục hồi sau khó khăn
    - nang_luc_id: kien_tri
      mo_ta: Bạn có khả năng tiếp tục nỗ lực qua thời gian dài dù kết quả chậm đến, dù hoàn cảnh liên
        tục tạo rào cản. Đây không phải là kiểu kiên trì bùng nổ mà là sự bền bỉ âm thầm, dai dẳng – bạn
        không bỏ cuộc dễ dàng ngay cả khi mọi thứ kéo dài hơn dự kiến rất nhiều. Năng lực này ổn định
        và xuyên suốt, đặc biệt phát huy trong những giai đoạn phải tự lập, xây dựng sự nghiệp từ đầu
        hoặc duy trì công việc qua nhiều trở ngại lặp đi lặp lại.
      giai_thich: Cung Thân cư Tài Bạch gặp Tuần không bị "cắt" như Triệt mà chỉ bị "vây", làm chậm, khiến
        mọi việc vòng vèo nhưng không đứt gãy – tạo nên pattern "chậm nhưng không dừng" ở phần tự lập
        và hậu vận. Đà La tại Quan Lộc dù là hung tinh lại mang tính bám trụ, dai dẳng, kết hợp với Thiên
        Lương (sao của sự bền bỉ, trường thọ) chiếu Mệnh tạo nên sức chịu đựng lâu dài. Cách cục "Tả Hữu
        đơn thủ chiếu Mệnh, ly tông" buộc phải sớm lìa gia đình, tự lập từ sớm – hoàn cảnh này tôi luyện
        sự kiên trì qua thực tế chứ không chỉ qua ý chí. Toàn bộ cấu trúc Mệnh Triệt-Thân Tuần tạo nên
        một cuộc đời mà sự tiến bộ đến chậm nhưng đều đặn, vì mỗi rào cản đều được vượt qua thay vì né
        tránh.
      nang_luc: Kiên trì
    - nang_luc_id: hoc_tu_kinh_nghiem
      mo_ta: Bạn không phải mẫu người tiếp thu nhanh qua sách vở hay đào tạo chính quy, nhưng lại biến
        trải nghiệm thực tế – kể cả sai lầm và thất bại – thành hiểu biết sâu sắc và dùng được lâu dài.
        Kiến thức của bạn thường đến chậm hơn người khác nhưng một khi đã thấm thì rất chắc và khó ai
        lấy đi được. Năng lực này phát huy mạnh nhất khi bạn được trực tiếp trải nghiệm, thử sai và rút
        bài học từ chính quá trình đó, thay vì chỉ tiếp nhận lý thuyết thuần túy.
      giai_thich: 'Văn Xương và Văn Khúc đều hãm địa trong tam phương tứ chính Mệnh, cho thấy kênh tiếp
        thu qua con đường học thuật chính quy hoặc biểu đạt văn chương truyền thống bị trở ngại. Tuy nhiên,
        Hóa Khoa đóng tại cung Thân trên sao Hữu Bật cho thấy trí tuệ thực sự phát triển qua quá trình
        tự thân vận động, tương tác và giải quyết vấn đề thực tế. Thân vô chính tinh buộc phải "mượn"
        kinh nghiệm bên ngoài để lấp đầy khoảng trống định hướng, biến mỗi trải nghiệm thành một mảnh
        kiến thức có cấu trúc. Sự kết hợp giữa kênh chính quy bị hạn chế (Xương Khúc hãm) và kênh thực
        tế được Hóa Khoa kích hoạt tại cung tự lập tạo nên mô hình học tập đặc thù: chậm qua sách vở nhưng
        sâu và bền qua trải nghiệm thực.'
      nang_luc: Học từ kinh nghiệm
    diem_yeu:
    - ten: Phân tích quá đà dẫn đến khó chốt quyết định
      loai: qua_da
      mo_ta: Khi đứng trước một lựa chọn quan trọng, bạn thường tiếp tục phân tích, cân nhắc thêm thay
        vì chốt lại. Tâm trí bạn luôn tìm thấy thêm một góc khuất cần xem xét, thêm một khả năng cần loại
        trừ, khiến thời gian từ lúc cân nhắc đến lúc quyết định kéo dài hơn mức cần thiết. Biểu hiện này
        nổi trội trong những quyết định có tính bước ngoặt hoặc khi thông tin không đầy đủ, và có xu hướng
        mạnh lên khi bạn càng có nhiều dữ liệu để phân tích – nghịch lý là càng biết nhiều càng khó chốt.
      giai_thich: 'Cự Môn hãm tại Quan Lộc mang năng lực phân tích và chất vấn nhưng ở trạng thái hãm,
        nó tạo khuynh hướng nhìn thấy quá nhiều mặt trái, quá nhiều điểm cần hoài nghi trước khi cam kết.
        Đà La hãm đồng cung làm mọi thứ chậm lại, kéo dài thêm thời gian phân tích nhưng cũng khiến quá
        trình này trở nên vô tận. Tại Phúc Đức, Thiên Cơ hãm nhận Hóa Kỵ tạo thêm lớp "ám ảnh" – tâm trí
        không ngừng quay trở lại vấn đề ngay cả khi đã phân tích đủ, liên tục đặt câu hỏi "nhưng nếu...".
        Ba lớp này cộng hưởng: Cự Môn đặt câu hỏi, Đà La kéo dài quá trình, Hóa Kỵ không cho buông – khiến
        việc đi đến một quyết định dứt khoát trở thành thử thách thực sự, đặc biệt khi không có deadline
        cứng hoặc áp lực bên ngoài buộc phải chốt.'
    - ten: Khó chuyển từ suy nghĩ sang hành động cụ thể
      loai: han_che_truc_tiep
      mo_ta: Bạn thường mất nhiều thời gian để thực sự bắt tay vào việc, ngay cả khi đã hiểu rõ vấn đề
        và biết mình cần làm gì. Có một khoảng cách lớn giữa "biết" và "làm" – giai đoạn chuẩn bị, suy
        tính thường kéo dài hơn dự kiến, và việc vượt qua quán tính ban đầu để bước vào hành động đòi
        hỏi nỗ lực ý chí đáng kể. Biểu hiện này rõ nhất khi bạn phải tự khởi xướng một việc mới mà không
        có áp lực bên ngoài hoặc mốc thời gian rõ ràng; khi có deadline hoặc người khác thúc đẩy, bạn
        vẫn hoàn thành được nhưng vẫn chậm hơn ở bước đầu.
      giai_thich: 'Cung Thân cư Tài Bạch không có chính tinh tọa thủ, tạo cảm giác thiếu động lực cốt
        lõi hoặc thiếu "ngôi sao dẫn đường" cho hành động – mọi thứ phải được lắp ghép từ bên ngoài thay
        vì có sẵn một lực đẩy nội tại. Tuần đóng tại đây làm mọi sự vận hành trở nên chậm chạp, vòng vèo,
        không đi thẳng vào vấn đề mà luôn qua đường vòng. Thiên Mã – sao của sự khởi động, di chuyển và
        hành động – cũng tại cung này lại gặp Tuần tạo thành cách "Tử Mã": con ngựa bị vây, mất đường
        chạy, nghĩa là năng lượng hành động bị kìm hãm ngay từ nguồn. Ba yếu tố này cùng tác động lên
        cung Thân (phần tự lập, cách vận hành cuộc đời): thiếu chính tinh định hướng, Tuần làm chậm mọi
        quá trình, và Mã bị chặn khiến xung lực hành động không thể bung ra – tạo nên rào cản cấu trúc
        khiến việc chuyển từ tư duy sang hành động trở thành điểm nghẽn thường trực.'
    - ten: Khó buông một vấn đề về mặt tâm trí
      loai: qua_da
      mo_ta: Khi một vấn đề chưa được giải quyết thỏa đáng hoặc một câu hỏi chưa có lời đáp trọn vẹn,
        tâm trí bạn có xu hướng quay trở lại nó liên tục, ngay cả khi nó không còn liên quan đến hoàn
        cảnh hiện tại. Bạn khó "gác lại" một chuyện để tập trung vào việc khác, và đôi khi dành quá nhiều
        năng lượng tinh thần cho những vấn đề đã qua hoặc những điều không thể thay đổi. Biểu hiện này
        mạnh lên khi bạn ở một mình, ít bị phân tán bởi công việc hoặc tương tác xã hội, và nó có thể
        làm giảm chất lượng nghỉ ngơi cũng như khả năng tái tạo năng lượng.
      giai_thich: 'Hóa Kỵ trên Thiên Cơ hãm tại Phúc Đức là cấu trúc chính tạo nên pattern này. Thiên
        Cơ vốn là sao của tư duy, tính toán, suy luận; khi hãm địa lại nhận Hóa Kỵ – sao của sự ám ảnh,
        vướng mắc, không thuận – nó biến hoạt động tư duy thành vòng lặp: tâm trí cứ quay lại cùng một
        vấn đề mà không thể đóng lại, liên tục tìm kiếm một lời giải "đủ tốt" mà tiêu chuẩn đó luôn dịch
        chuyển. Phúc Đức là cung của nội tâm, trạng thái tinh thần sâu kín, nên pattern này hoạt động
        ở lớp sâu mà người ngoài khó thấy – bên ngoài bạn vẫn có vẻ bình thản nhưng bên trong tâm trí
        không ngừng quay vòng. Hóa Quyền trên Thái Âm hãm đồng cung tạo một mức độ kiểm soát cảm xúc nhất
        định, giúp bạn không bộc lộ sự bất an ra ngoài, nhưng nó không đủ để ngăn Thiên Cơ nhận Hóa Kỵ
        tiếp tục quay vòng ở lớp tư duy thuần túy.'
- profile:
    name: Dung
    birth_date: '1995-09-17'
    birth_time: 14
    gender: male
  output:
    tong_quan: 'Hồ sơ năng lực của bạn được định hình bởi bộ Sát Phá Tham đều miếu địa trong tam phương
      Mệnh, tạo nên một profile thiên về hành động quyết liệt, phản ứng nhanh và khả năng xoay xở trong
      hoàn cảnh khó khăn. Năng lượng chủ đạo là dám khởi sự, dám đối đầu và đọc tình huống sắc bén trong
      bối cảnh cần hành động tức thì. Tuy nhiên, chính cường độ năng lượng này cũng tạo ra mặt trái: xu
      hướng hành động trước khi cân nhắc đủ, và khó duy trì nhịp độ ổn định qua thời gian khi sự nghiệp
      và các đầu việc dài hơi thường trải qua thăng giáng thất thường. Cung Thân cư Phúc Đức mang cách
      cục ''Tham Vũ Thân cung hạ cách'' cùng Địa Không hãm và Kình Dương, tạo thêm áp lực lên khả năng
      duy trì thành quả lâu dài, khiến những khởi đầu mạnh mẽ thường không chuyển hóa thành tiến trình
      bền vững.'
    diem_manh:
    - nang_luc_id: khoi_dong_hanh_dong
      mo_ta: Bạn có khả năng vượt qua quán tính để bắt tay vào việc rất nhanh, không mắc kẹt ở giai đoạn
        chuẩn bị hay do dự. Khi nhận diện được mục tiêu, bạn lập tức hành động với tốc độ và sự quyết
        tâm cao, thường thúc đẩy mọi việc chuyển động trong khi người khác vẫn còn đang cân nhắc. Đây
        là khuynh hướng nổi trội và ổn định ở bạn, phát huy mạnh nhất trong các tình huống cần ai đó dám
        đi trước, dám nhận bước đầu tiên khi kết quả chưa rõ ràng.
      giai_thich: Thất Sát miếu địa tại Dần tạo cách 'Thất Sát triều đẩu' — một trong những cách cục mạnh
        nhất của Thất Sát, mang đặc tính 'can đảm, dũng mãnh, làm việc gì cũng muốn cho chóng xong.' Hỏa
        Tinh đắc địa đồng cung tại Mệnh cộng thêm tầng năng lượng nóng, thúc đẩy hành động tức thì thay
        vì trì hoãn. Đà La đắc địa bổ sung chiều sâu mưu lược ngầm, giúp sự khởi động không chỉ là bốc
        đồng mà có tính toán phía sau. Tổng hợp ba yếu tố này trong cung Mệnh tạo nên một động lực khởi
        sự vừa nhanh, vừa có chiều sâu chiến thuật, vừa bền bỉ trong quyết tâm.
      nang_luc: Khởi động hành động
    - nang_luc_id: xu_ly_khung_hoang
      mo_ta: Bạn tỏ ra bình tĩnh và hiệu quả bất thường khi đối mặt với tình huống nghiêm trọng, nguy
        hiểm hoặc có áp lực cao. Trong khi nhiều người tê liệt hoặc hoảng loạn, bạn lại tìm được cách
        xoay xở, ưu tiên đúng việc cần làm và đưa ra hành động quyết liệt. Khả năng này phát huy rõ nhất
        trong các bối cảnh khủng hoảng thực sự — nơi thời gian hạn hẹp, thông tin không đầy đủ và hậu
        quả nếu thất bại là nghiêm trọng.
      giai_thich: 'Phá Quân miếu địa tại Ngọ trong cung Quan Lộc được Tân Biên mô tả là ''thành công trong
        những việc thật khó khăn và nguy hiểm, có nhiều mưu trí và rất dũng mãnh.'' Đây là đặc tính nổi
        bật của Phá Quân khi miếu địa tại Tý Ngọ — năng lực hành động hiệu quả nhất trong hoàn cảnh mà
        người khác không dám dấn thân. Sự hiện diện của Địa Kiếp hãm và Triệt trong cùng cung tuy tạo
        thăng trầm cho sự nghiệp, nhưng đồng thời cũng rèn luyện khả năng thích nghi với biến động và
        phản ứng nhanh trước các tình huống bất ngờ. Bộ Sát Phá Tham hội tụ trong tam phương càng củng
        cố khuynh hướng này: cả ba sao đều mang tính chất hành động mạnh, không ngại đối đầu.'
      nang_luc: Xử lý khủng hoảng
    - nang_luc_id: phan_doan_tinh_huong
      mo_ta: Bạn có khả năng đọc nhanh và tương đối chính xác trạng thái thực của một tình huống, đặc
        biệt trong các bối cảnh cạnh tranh, đối đầu hoặc cần ra quyết định gấp. Bạn nhận ra điều gì đang
        thực sự diễn ra, ai đang nắm thế chủ động, và đâu là điểm mấu chốt cần tác động — thường trước
        khi người khác kịp phân tích đầy đủ. Khả năng này ổn định và phát huy rộng, từ công việc đến các
        tương tác xã hội có tính chiến lược.
      giai_thich: Thất Sát miếu địa tại Dần được Tân Biên ghi nhận là 'thông minh, có nhiều mưu cơ' —
        đây không phải trí tuệ học thuật mà là sự sắc bén trong đọc tình thế thực tế. Đà La đắc địa đồng
        cung bổ sung đặc tính 'thâm trầm, có mưu cơ, thủ đoạn,' tạo nên lớp nhận định ngầm, không bộc
        lộ ngay ra ngoài nhưng rất chính xác. Cách 'Xương Khúc giáp Mệnh' bao quanh cung Mệnh cũng góp
        phần tăng cường khả năng nhận định và phân tích. Thiên Di có Tử Vi, Thiên Phủ đều miếu địa cùng
        Hóa Khoa cho thấy khi tiếp xúc với bên ngoài, bạn có khả năng đánh giá con người và hoàn cảnh
        với độ tin cậy cao, dù Tuần tại đây làm giảm phần nào tốc độ tiếp cận ban đầu.
      nang_luc: Phán đoán tình huống
    diem_yeu:
    - ten: Hành động trước khi cân nhắc đủ
      loai: qua_da
      mo_ta: Xu hướng nổi bật của bạn là phản ứng và hành động rất nhanh khi có kích thích, đôi khi trước
        khi kịp đánh giá đầy đủ các hệ quả hoặc phương án thay thế. Biểu hiện này không phải là thiếu
        năng lực phán đoán — bạn vẫn đọc tình huống tốt — mà là năng lượng hành động quá mạnh khiến bước
        cân nhắc bị rút ngắn hoặc bỏ qua. Nó xuất hiện ổn định ở hầu hết các bối cảnh, đặc biệt khi bạn
        cảm thấy bị thách thức hoặc khi cơ hội có vẻ đang trôi qua.
      giai_thich: Thất Sát tại Mệnh vốn mang tính 'nóng nảy, làm việc gì cũng muốn cho chóng xong,' và
        Hỏa Tinh đắc địa đồng cung khuếch đại đặc tính này thành một thôi thúc hành động gần như tức thì.
        Tân Biên mô tả Hỏa Tinh đắc địa thủ Mệnh là người 'can đảm, dũng mãnh, có chí khí hiên ngang'
        nhưng cũng 'ương ngạnh, nóng nảy.' Sự kết hợp này tạo ra một động lực rất mạnh từ nhận định sang
        hành động, với rất ít khoảng đệm để phản tư. Đà La tuy thêm chiều sâu mưu lược nhưng ở vị trí
        đồng cung với Hỏa Tinh, nó không đủ để kéo chậm tốc độ phản ứng mà chỉ làm cho hành động thêm
        phần quyết liệt và ít bộc lộ.
    - ten: Khó duy trì tiến độ ổn định qua thời gian
      loai: han_che_truc_tiep
      mo_ta: Bạn thường khởi đầu mọi việc với năng lượng rất cao nhưng gặp khó khăn trong việc giữ nhịp
        độ đều đặn và đưa công việc đến điểm kết thúc bền vững. Sự nghiệp và các dự án dài hơi của bạn
        có xu hướng trải qua nhiều đợt thăng giáng — có giai đoạn tiến rất nhanh, rồi bỗng chậm lại, đứt
        đoạn hoặc phải làm lại từ đầu. Đây là hạn chế trực tiếp và nổi bật, ảnh hưởng rõ nhất đến các
        mục tiêu đòi hỏi sự kiên trì qua nhiều năm.
      giai_thich: 'Cung Quan Lộc tại Ngọ có Phá Quân miếu địa nhưng đồng cung với Địa Kiếp hãm và chịu
        ảnh hưởng của Triệt. Tân Biên ghi nhận Phá Quân đơn thủ tại Tý Ngọ ''võ nghiệp hiển đạt nhưng
        thăng giáng thất thường'' — sự nghiệp có đỉnh cao nhưng không ổn định. Triệt tại Quan Lộc cắt
        đứt hoặc làm gián đoạn luồng phát triển liên tục, trong khi Địa Kiếp hãm thêm yếu tố phá tán,
        khiến những gì xây dựng được dễ bị xáo trộn. Ở chiều sâu hơn, cung Thân cư Phúc Đức mang cách
        ''Tham Vũ Thân cung vi hạ cách'' — hướng đi后半生 bị ràng buộc, ''suốt đời vất vả.'' Địa Không hãm
        tại đây cùng Kình Dương tạo thêm lớp bất ổn: năng lượng xây dựng (Vũ Khúc miếu) bị xói mòn bởi
        yếu tố phá tán đột ngột và xung lực quá mạnh, khiến thành quả khó được duy trì lâu dài.'
- profile:
    name: Trung
