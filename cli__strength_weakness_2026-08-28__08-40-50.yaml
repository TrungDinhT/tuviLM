      dài và theo đuổi công việc đến mức tinh thục. Mệnh Liêm Trinh và Phá Quân đều hãm địa kết hợp Hóa
      Kỵ tạo nên một profile vừa tháo vát, đa năng vừa dễ phân tán, nông nổi. Thân cư Thiên Di với Thiên
      Tướng hãm củng cố xu hướng hoạt động bên ngoài và di chuyển. Quan Lộc và Tài Bạch sáng hơn với Vũ
      Khúc, Tham Lang, Tử Vi, Thất Sát miếu địa, nhưng Triệt tại Tài Bạch làm giảm khả năng tích lũy bền
