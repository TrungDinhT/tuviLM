    - nang_luc_id: tien_lieu_dien_bien
      mo_ta: Bạn thường hình dung được cách một tình huống có thể phát triển theo thời gian dựa trên những
        dấu hiệu hiện có, từ đó chuẩn bị tinh thần và phương án trước khi sự việc thực sự xảy ra. Bạn
