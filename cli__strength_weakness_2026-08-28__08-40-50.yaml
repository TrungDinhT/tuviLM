        tiễn cao, thiên về đọc vị con người và hoàn cảnh cụ thể hơn là suy luận trừu tượng. Bạn thường
        nhận ra vấn đề trước khi nó được phát biểu rõ ràng, đặc biệt trong các tình huống có yếu tố lợi
        ích, động cơ hoặc rủi ro tiềm ẩn. Năng lực này hoạt động tốt ngay cả khi thông tin chưa đầy đủ,
        nhờ khả năng kết hợp quan sát nhanh với kinh nghiệm thực tế.
