        tại Quan cũng ''nhân hậu, khoan hòa'' — hai yếu tố này tạo nên thái độ mềm dẻo trong tương tác,
        giúp duy trì quan hệ hợp tác lâu dài hơn là tạo ấn tượng mạnh ban đầu.'
      nang_luc: Hợp tác
    diem_yeu:
    - ten: Phán đoán tình huống thiếu chính xác
      loai: han_che_truc_tiep
      mo_ta: Bạn dễ đọc sai trạng thái thực tế của một tình huống, đặc biệt khi thông tin đến nhanh hoặc
        khi cần đánh giá ý định của người khác. Biểu hiện thường gặp là đưa ra nhận định dựa trên ấn tượng
        ban đầu rồi sau đó phát hiện mình đã bỏ sót yếu tố quan trọng, hoặc hiểu nhầm động cơ của người
        xung quanh dẫn đến thị phi không đáng có. Hạn chế này xuất hiện khá ổn định across các bối cảnh,
        nhưng giảm đi khi bạn có đủ thời gian để kiểm tra lại và tham khảo ý kiến người tin cậy.
      giai_thich: 'Thiên Cơ hãm địa tại Mệnh được sách mô tả là ''kém sáng suốt,'' và khi Hóa Kỵ bám vào
        chính Thiên Cơ, lớp mờ càng dày thêm: ''hay nhầm lẫn, tính nông nổi, hay mắc thị phi khẩu thiệt.''
        Thái Âm hãm địa đồng cung cũng ''kém sáng suốt'' và ''tính ương ngạnh'' — nghĩa là không chỉ thiếu
        clarity mà còn có xu hướng bám vào nhận định đã hình thành dù nó sai. Hóa Kỵ thuộc Thủy trên nền
        Thiên Cơ thuộc Mộc (Thủy sinh Mộc) khiến ảnh hưởng của Kỵ thấm sâu vào quá trình tư duy thay vì
        chỉ tạo rắc rối bên ngoài. Cát tinh bao quanh (Tả Hữu, Khoa, Quyền) giúp bù đắp phần nào ở lớp
        vận hành bên ngoài, nhưng không thay đổi được gốc tư duy tại Mệnh.'
    - ten: Khó duy trì đường hướng dài hạn
      loai: han_che_truc_tiep
      mo_ta: Bạn thường xuyên thay đổi ý định, công việc hoặc hướng đi trước khi kịp thấy kết quả, tạo
        ra cảm giác dang dở và thiếu tích lũy. Biểu hiện cụ thể là bắt đầu nhiều thứ nhưng chóng chán,
        hay chuyển đổi kế hoạch khi gặp khó khăn đầu tiên thay vì tìm cách vượt qua, và có xu hướng tiêu
        tốn nguồn lực cho việc khởi động lại hơn là cho việc đi đến cùng. Mặt này hiện diện rõ nhất trong
        các quyết định cá nhân và tài chính, nhưng có thể được kiểm chế khi bạn làm việc trong tổ chức
        có deadline và accountability rõ ràng.
      giai_thich: Cung Thân cư Tài Bạch có Thiên Đồng hãm địa tọa thủ — sách ghi rõ 'không quả quyết,
        không bền chí, hay thay đổi ý kiến, công việc' và 'làm việc gì rồi cũng chóng chán.' Thân là cung
        thể hiện hành động và xu hướng後半生, nên đặc tính 'canh cải, thất thường' của Thiên Đồng hãm ảnh
        hưởng trực tiếp đến cách bạn triển khai hành động thực tế. Thêm vào đó, cách cục Hao thủ Mệnh
        (Tiểu Hao tại Mệnh, Đại Hao tại Thiên Di) mô tả 'khôn ngoan nhưng không quả quyết, tiêu tiền không
        biết tiếc, suốt đời túng thiếu' — sự kết hợp giữa thiếu quyết đoán và xu hướng phân tán nguồn
        lực. Thiên Đồng thuộc Dương Thủy tại Tuất (Dương Thổ) tạo xung khắc nội tại, khiến năng lượng
        hành động bị tiêu hao vào việc thay đổi thay vì tích lũy.
    - ten: Xung đột giữa mong muốn kiểm soát và thực tế thiếu clarity
      loai: xung_dot
      mo_ta: Bạn có xu hướng muốn nắm quyền quyết định và áp đặt ý chí lên tình huống, nhưng đồng thời
        lại thiếu đủ clarity để làm điều đó một cách chính xác. Kết quả là bạn dễ rơi vào trạng thái kiên
        quyết bảo vệ một hướng đi mà bản thân cũng không chắc chắn, hoặc phản ứng mạnh khi bị thách thức
        dù chưa có đủ cơ sở. Xung đột này tạo ra căng thẳng nội tại và có thể gây friction với người xung
        quanh, đặc biệt khi bạn ở vị trí cần ra quyết định độc lập mà không có hệ thống hỗ trợ.
      giai_thich: 'Hóa Quyền bám vào Thái Âm tại Mệnh tạo ra drive ''mạnh bạo, mau mắn, thích nắm quyền
        hành,'' nhưng Thái Âm đang ở trạng thái hãm địa — ''kém sáng suốt, tính ương ngạnh.'' Sách ghi
        Hóa Quyền ''gặp nhiều sao xấu xa thì làm cho xấu xa thêm,'' nghĩa là nó khuếch đại cả mặt tích
        cực lẫn tiêu cực của sao chủ. Ở đây, Quyền khuếch đại sự ương ngạnh của Thái Âm hãm và kết hợp
        với Hóa Kỵ trên Thiên Cơ (nông nổi, nhầm lẫn) tạo thành một dynamic: muốn kiểm soát nhưng thiếu
        tầm nhìn đủ rộng. Đẩu Quân tại Mệnh (''nghiêm nghị, khắc nghiệt'') thêm vào lớp cứng rắn trong
        thái độ, khiến việc thừa nhận sai lầm hoặc điều chỉnh hướng đi trở nên khó khăn hơn. Đây là xung
        đột cấu trúc giữa ba yếu tố tại Mệnh, không phải hạn chế có thể giải quyết bằng nỗ lực đơn lẻ
        mà cần môi trường có cơ chế phản hồi và người đối trọng.'
