    diem_yeu:
    - ten: Khó duy trì nhịp độ ổn định
      loai: han_che_truc_tiep
      mo_ta: Bạn thường làm việc theo kiểu bùng nổ rồi hụt hơi hơn là duy trì nhịp độ đều đặn qua thời
        gian. Giai đoạn cao hứng, bạn có thể xử lý khối lượng công việc rất lớn với tốc độ ấn tượng; nhưng
        sau đó dễ rơi vào giai đoạn mất đà, giảm hứng thú hoặc đổi hướng hoàn toàn. Pattern này lặp lại
        khá nhất quán trong nhiều lĩnh vực – từ công việc, dự án cá nhân đến các mối quan tâm – và trở
        nên rõ rệt hơn khi công việc đòi hỏi sự kiên trì dài hạn mà không có biến cố kích thích.
      giai_thich: Cách cục Mệnh Không Thân Kiếp mô tả trực tiếp 'thành bại thất thường, lên xuống mạnh,
        khó bình ổn' và 'mất rồi lại có, có rồi lại mất, đổi hướng lớn'. Đây là cấu trúc nền tảng tạo
        ra nhịp sống cực đoan. Phá Quân miếu ở Thân cư Phúc Đức vốn chủ về thay đổi lớn, không duy trì
        trạng thái cũ; khi kết hợp với Địa Kiếp hãm, nó tạo xu hướng phá bỏ và làm lại thay vì tiếp tục
        xây dựng trên nền đang có. Hỏa Tinh đắc tại Thân cung tạo năng lượng bùng nổ nhưng ngắn hạn, không
        bền. Đại Hao tại Quan Lộc cũng góp phần vào xu hướng hao tán năng lượng và nguồn lực theo chu
        kỳ. Phủ Tướng hội Mệnh cho bạn đủ tài nguyên để bắt đầu lại, nhưng chính sự dồi dào đó có thể
        vô tình khuyến khích chu kỳ 'phá–xây' thay vì duy trì.
    - ten: Hành động trước khi cân nhắc đủ
      loai: qua_da
      mo_ta: 'Sự quyết đoán vốn là điểm mạnh của bạn có mặt trái: khi bị kích thích, áp lực hoặc cảm thấy
        bị thách thức, bạn dễ chuyển từ quyết đoán sang hành động tức thì mà không dành đủ thời gian đánh
        giá hậu quả. Biểu hiện này không xuất hiện trong mọi tình huống – bạn vẫn cân nhắc được khi bình
        tĩnh – nhưng khi cảm xúc dâng cao hoặc bị dồn vào thế phải phản ứng, khoảng cách giữa nhận tín
        hiệu và hành động bị rút ngắn quá mức. Hậu quả thường là những quyết định cần phải điều chỉnh
        hoặc khắc phục sau đó.'
      giai_thich: 'Năng lượng quyết đoán của Vũ Khúc miếu khi đi qua lăng kính của cụm sát tinh trở nên
        quá đà. Kình Dương hãm tại Thân cung mang tính hung hăng, thôi thúc hành động mạnh mẽ; Hỏa Tinh
        đắc tạo phản ứng nhanh và nóng; Địa Kiếp hãm đẩy hành động sang hướng cực đoan, quyết liệt đến
        mức bất chấp. Phá Quân miếu ở Thân vốn đã chủ về hành động drastich, khi kết hợp với Hỏa–Kiếp–Kình
        tạo thành một chain reaction: tín hiệu kích thích → phản ứng cảm xúc (Hỏa Tinh) → thôi thúc hành
        động (Kình Dương) → hành động cực đoan (Địa Kiếp + Phá Quân). Tuần tại Quan Lộc và Triệt tại Tài
        Bạch đáng lẽ tạo sự kìm hãm, nhưng chúng nằm ở cung khác chứ không trực tiếp án ngữ Mệnh hay Thân,
        nên lực kiểm soát xung động tại chính trung tâm hành động (Thân cư Phúc Đức) bị yếu.'
    - ten: Giao tiếp thẳng và cứng, khó điều chỉnh theo người nghe
      loai: qua_da
      mo_ta: Bạn có xu hướng nói thẳng điều mình nghĩ và giữ vững lập trường, đôi khi đến mức thiếu linh
        hoạt trong cách diễn đạt. Khi người đối diện cần sự mềm mỏng, gián tiếp hoặc cần được dẫn dắt
        từ từ, bạn vẫn giữ nguyên cách nói trực diện và có phần cứng rắn. Điều này không phải do thiếu
        hiểu biết mà do bản năng ưu tiên sự thẳng thắn và trung thực với quan điểm của mình hơn là điều
        chỉnh theo phản ứng người nghe. Biểu hiện này rõ nhất khi bạn tin rằng mình đúng hoặc khi thảo
        luận về các vấn đề bạn coi trọng.
      giai_thich: Vũ Khúc miếu được Tân Biên mô tả là 'thẳng thắn' – đây là đặc tính cố hữu, không phải
        thói quen có thể dễ dàng thay đổi. Tang Môn thủ Mệnh kết hợp với Bạch Hổ ở Thiên Di tạo cách cục
        'can đảm, cương nghị, hơi ương ngạnh' – sự ương ngạnh này thể hiện rõ trong giao tiếp khi bạn
        không muốn uốn lời theo ý người khác. Đà La hãm tại Mệnh bổ sung tính cố chấp, khó thay đổi hướng
        đã chọn. Thiên Hình tại Thân cung (cung Phúc Đức) mang tính nguyên tắc cứng nhắc, khiến bạn có
        xu hướng áp dụng cùng một chuẩn mực cho mọi tình huống thay vì linh hoạt. Cụm Tang Hổ gặp sát
        tinh hội hợp tuy mô tả theo hướng tiêu cực hơn trong sách, nhưng ở mức độ năng lực giao tiếp,
        nó cho thấy pattern cứng rắn và thiếu điều chỉnh là có cấu trúc vững chắc trong lá số.
    - ten: Phản ứng cảm xúc dễ lấn át khi áp lực kéo dài
      loai: xung_dot
      mo_ta: 'Bên trong bạn tồn tại một mâu thuẫn: một mặt bạn quyết đoán và hướng đến hành động lý trí,
        mặt khác bạn mang sẵn độ nhạy cảm sâu và dễ bị cảm xúc chi phối khi áp lực tích tụ. Trong các
        tình huống ngắn hạn, bạn có thể giữ được sự bình tĩnh và hành động hiệu quả. Nhưng khi áp lực
        kéo dài – đặc biệt liên quan đến những vấn đề bạn gắn bó cảm xúc – cảm xúc có xu hướng dâng lên
        và nhuộm màu vào cách bạn phán đoán và phản ứng. Kết quả là những quyết định trong giai đoạn này
        thường mang dấu ấn của trạng thái cảm xúc hơn là đánh giá khách quan.'
      giai_thich: 'Thiên Khốc và Thiên Hư thủ Mệnh tạo cách cục ''đa sầu đa cảm, suốt đời ưu tư phiền
        muộn'' – đây là lớp nền cảm xúc sâu và dai dẳng. Tang Môn tại Mệnh và Bạch Hổ ở Thiên Di cũng
        góp vào ''ưu tư phiền muộn'' theo cách cục Tang Hổ thổ thủ Mệnh. Cùng lúc đó, Hỏa Tinh đắc tại
        Thân cung mang năng lượng cảm xúc nóng, dễ bùng phát. Mâu thuẫn nằm ở chỗ: Vũ Khúc và Phá Quân
        thúc đẩy hành động nhanh, quyết liệt, dựa trên lý trí và ý chí; nhưng Khốc–Hư–Tang–Hổ liên tục
        tạo ra dòng cảm xúc ngầm có thể trào lên khi sức ép đủ lớn. Hóa Kỵ tại Điền Trạch (Thiên Cơ) cho
        thấy có một vùng đời sống – gia đình, nơi ở, sự an toàn cơ bản – nơi cảm xúc tiêu cực dễ bị kích
        hoạt và khó giải tỏa, từ đó ảnh hưởng lan tỏa sang các quyết định ở lĩnh vực khác.'
- profile:
    name: Hoang
    birth_date: '2000-01-07'
    birth_time: 6
    gender: male
  output:
    tong_quan: Hồ sơ năng lực của bạn được định hình bởi sự tương phản giữa lớp bề mặt và chiều sâu bên
      trong. Mệnh có Cự Môn hãm địa tạo khuynh hướng xử lý thông tin qua ngôn ngữ nhưng dễ méo mó - đa
      nghi, vội vàng trong phát ngôn và thiếu chính xác khi đọc tình huống. Thân cư Thiên Di với Thiên
      Đồng hãm khiến bạn linh hoạt trong môi trường mới nhưng khó duy trì cam kết dài hạn, thường xuyên
      thay đổi hướng đi trước khi mọi việc kịp chín muồi. Điểm sáng nằm ở Phúc Đức với Thiên Lương miếu
      địa kết hợp Hóa Khoa và Thiên Khôi, tạo nền tảng trí tuệ sâu và khả năng rút ra bài học thực chất
      từ trải nghiệm. Đây là năng lực cốt lõi giúp bạn bù đắp phần nào những hạn chế ở Mệnh và Thân. Tài
      Bạch có Thái Dương miếu địa cùng Lộc Tồn cho thấy bản năng nhận diện giá trị thực tế vẫn hiện diện,
      dù nó không đủ để thay đổi bức tranh tổng thể khi các cung Mệnh, Thân còn nhiều thử thách.
    diem_manh:
    - nang_luc_id: nghien_cuu_chuyen_sau
      mo_ta: Bạn có khả năng đi sâu vào một lĩnh vực, tích lũy kiến thức dày và chắc theo cách có hệ thống.
        Khi đã thực sự quan tâm đến một chủ đề, bạn duy trì sự tìm hiểu bền bỉ, không dừng ở lớp bề mặt
        mà tiếp tục đào cho đến khi nắm được cấu trúc cốt lõi. Năng lực này nổi trội hơn hẳn so với các
        mặt khác trong profile, ổn định qua thời gian và phát huy tốt nhất khi bạn làm việc độc lập hoặc
        trong môi trường cho phép tập trung dài hạn, ít bị phân tán bởi áp lực phải phản ứng nhanh.
      giai_thich: Phúc Đức an tại Tý có Thiên Lương miếu địa - sao chủ về trí tuệ, bảo vệ và nguyên tắc
        - kết hợp với Hóa Khoa (tượng trưng cho học thuật, sự minh bạch và giải trừ hung họa) và Thiên
        Khôi (khởi đầu thuận lợi, dẫn dắt). Bộ sao này tạo nền tảng nội tại vững chắc cho việc nghiên
        cứu có chiều sâu. Hóa Khoa tại Phúc Đức còn có vai trò hóa giải phần nào tính hung của Cự Môn
        hãm ở Mệnh, cho thấy khi bạn quay về với chiều sâu tri thức thay vì phản ứng bề mặt, năng lực
        trí tuệ thực sự được kích hoạt. Thiên Lương miếu mang tính hệ thống và bảo tồn, Hóa Khoa mang
        tính minh xác - sự phối hợp này giải thích vì sao bạn có thể duy trì sự tìm hiểu chuyên sâu mà
        không bị lạc hướng.
      nang_luc: Nghiên cứu chuyên sâu
    - nang_luc_id: hoc_tu_kinh_nghiem
      mo_ta: Bạn có khả năng biến những trải nghiệm thực tế - kể cả sai lầm và thất bại - thành hiểu biết
        dùng được cho những lần sau. Dù cuộc đời có nhiều lần thay đổi hướng đi, mỗi lần như vậy bạn đều
        rút ra được điều gì đó có giá trị, dần dần xây dựng vốn hiểu biết phong phú từ chính sự đa dạng
        trong trải nghiệm. Năng lực này phát huy rõ nhất khi bạn có không gian để nhìn lại và tổng kết,
        thay vì bị cuốn ngay vào vòng xoáy tiếp theo.
      giai_thich: 'Thiên Đồng tại Thân cư Thiên Di tạo ra cuộc đời nhiều biến động, thay đổi chỗ ở, công
        việc và hoàn cảnh - đây chính là nguồn nguyên liệu trải nghiệm phong phú. Đồng thời, Phúc Đức
        có Thiên Lương miếu kết hợp Hóa Khoa đóng vai trò như bộ lọc trí tuệ: nó tiếp nhận những trải
        nghiệm hỗn độn từ Thiên Đồng và chuyển hóa chúng thành bài học có cấu trúc. Thiên Y và Thiên Đức
        tại Phúc Đức hỗ trợ thêm khả năng nhận ra ý nghĩa ẩn sau các sự kiện. Sự kết hợp giữa một Thân
        liên tục tạo ra trải nghiệm mới và một Phúc Đức có khả năng chiết xuất bài học từ những trải nghiệm
        đó tạo nên năng lực học từ kinh nghiệm đặc trưng ở bạn.'
      nang_luc: Học từ kinh nghiệm
    diem_yeu:
    - ten: Xung động trong lời nói
      loai: qua_da
      mo_ta: Bạn thường nói trước khi kịp cân nhắc, dễ phóng đại hoặc phát ngôn thiếu chính xác, dẫn đến
        thị phi và hiểu lầm không đáng có. Biểu hiện này không phải lúc nào cũng xuất hiện nhưng trở nên
        rõ rệt khi bạn ở trong môi trường có nhiều kích thích, áp lực phải phản hồi nhanh hoặc khi cảm
        thấy bị nghi ngờ. Trong những tình huống cần sự thận trọng về ngôn từ, đây là điểm dễ gây tổn
        thất nhất.
      giai_thich: Cự Môn vốn là sao chủ ngôn ngữ và thị phi, khi hãm địa tại Tuất lại càng mờ ám - sách
        ghi rõ không cẩn ngôn, hay nói khoác lác. Hỏa Tinh đắc địa tại Tài Bạch trong tam hợp Mệnh thêm
        năng lượng nóng, gấp rút vào cách diễn đạt. Bệnh Phù và Địa Võng đồng cung tại Mệnh càng làm tăng
        khuynh hướng lời nói mang tính phòng thủ quá mức hoặc thiếu căn cứ. Sự kết hợp này khiến xung
        động ngôn ngữ không chỉ là thói quen mà còn là phản xạ tự vệ khi bạn cảm thấy bất an, khiến việc
        kiểm soát trở nên khó khăn hơn trong các tình huống căng thẳng.
    - ten: Khó duy trì tiến độ
      loai: han_che_truc_tiep
      mo_ta: Bạn thường bắt đầu nhiều việc nhưng khó theo đến cùng - công việc dễ dang dở khi hứng thú
        ban đầu giảm đi hoặc khi xuất hiện một hướng mới hấp dẫn hơn. Hạn chế này hiện diện khá ổn định
        trong nhiều lĩnh vực của đời sống, từ công việc đến các dự định cá nhân, và trở nên nghiêm trọng
        hơn khi không có áp lực bên ngoài hoặc cam kết rõ ràng với người khác.
      giai_thich: Thiên Đồng hãm địa tại Thân cư Thiên Di mang tính canh cải, thất thường - sách Tân Biên
        ghi rõ làm việc gì rồi cũng chóng chán, thay đổi thất thường. Vì Thân là cung chi phối hành động
        và cách bạn triển khai công việc trong thực tế, tính chất này của Thiên Đồng hãm ảnh hưởng trực
        tiếp đến khả năng duy trì nỗ lực. Quan Lộc vô chính diệu tại Dần không có sao chủ đạo để neo giữ
        phương hướng dài hạn, khiến sự thay đổi từ Thiên Đồng càng thiếu điểm tựa. Địa Kiếp tại Quan Lộc
        tuy cho sự táo bạo nhưng lại thiếu tính bền vững, góp phần vào mô hình bùng nổ rồi hụt hơi thay
        vì tiến đều.
    - ten: Thiếu quyết đoán
      loai: han_che_truc_tiep
      mo_ta: Bạn thường do dự kéo dài khi cần đưa ra lựa chọn, đặc biệt khi có nhiều phương án hoặc khi
        chưa chắc chắn về kết quả. Sự thiếu định kiến rõ ràng khiến bạn dễ bị lung lay bởi ý kiến người
        khác hoặc bởi thông tin mới, dẫn đến việc trì hoãn quyết định hoặc thay đổi lựa chọn vào phút
        chót. Hạn chế này hiện diện rộng nhưng giảm bớt khi bạn có đủ thời gian để nghiên cứu sâu - lĩnh
        vực mà Phúc Đức phát huy tác dụng.
      giai_thich: Thiên Đồng hãm địa được sách mô tả là không quả quyết, không có định kiến - đây là đặc
        tính cốt lõi của sao này khi ở trạng thái hãm. Vì Thiên Đồng án ngữ cung Thân nơi chi phối hành
        động thực tế, sự thiếu quyết đoán không chỉ nằm ở suy nghĩ mà còn biểu hiện thành sự trì trệ trong
        hành động. Cự Môn hãm tại Mệnh góp phần bằng cách tạo ra sự đa nghi và kém sáng suốt, khiến bạn
        không tin vào đánh giá của chính mình. Tuy nhiên, khi vấn đề thuộc lĩnh vực bạn đã nghiên cứu
        chuyên sâu, nơi Phúc Đức Thiên Lương kết hợp Hóa Khoa phát huy, mức độ do dự có thể giảm đáng
        kể vì bạn đã có nền tảng tri thức để dựa vào.
    - ten: Đọc sai tình huống
      loai: han_che_truc_tiep
      mo_ta: Bạn dễ misread những gì đang thực sự diễn ra, đặc biệt trong các tình huống xã hội hoặc khi
        cần đánh giá động cơ người khác. Khuynh hướng đa nghi kết hợp với sự thiếu sáng suốt khiến bạn
        có thể nhìn thấy mối đe dọa hoặc mâu thuẫn ở nơi không có, hoặc bỏ qua những tín hiệu quan trọng
        vì bị cuốn vào chi tiết gây nhiễu. Hạn chế này nổi bật khi bạn phải phán đoán nhanh và không có
        thời gian để phân tích kỹ.
      giai_thich: Cự Môn hãm địa tại Mệnh được sách Tân Biên mô tả là kém thông minh, gian quyệt, tham
        lam, khắc nghiệt, đa nghi, hay nhầm lẫn. Đây là mô tả trực tiếp về khả năng phán đoán tình huống
        bị suy giảm. Cự Môn vốn chủ về phân tích và ngôn ngữ, nhưng khi hãm tại Tuất - vị trí rất mờ ám
        xấu xa theo sách - khả năng này bị méo mó thành sự nghi ngờ thiếu căn cứ và nhầm lẫn trong đánh
        giá. Địa Kiếp và Hỏa Tinh trong tam hợp Mệnh thêm yếu tố impulsiveness vào quá trình nhận định,
        khiến bạn dễ vội vàng kết luận trước khi có đủ thông tin. Phúc Đức Thiên Lương kết hợp Hóa Khoa
        chỉ phát huy tác dụng hóa giải khi bạn chủ động dừng lại và suy xét kỹ - điều mà Thiên Đồng hãm
        tại Thân thường không cho phép.
- profile:
    name: Long
    birth_date: '1992-02-04'
    birth_time: 8
    gender: male
  output:
    tong_quan: Hồ sơ năng lực của bạn mang hình dạng đặc trưng của một trí tuệ chiến lược sâu sắc bị giới
      hạn bởi lớp ngăn cách giữa nhận thức và hành động. Trục Cơ–Lương miếu địa tại Mệnh tạo nên nền tảng
      phân tích và tư duy đa tầng vững chắc, nhưng Tuần án ngữ cùng Đà La hãm địa khiến năng lực trí tuệ
      chủ yếu hoạt động ở không gian nội tâm thay vì chuyển hóa thành bước đi dứt khoát bên ngoài. Phần
      vận hành (Thân cư Tài Bạch với chính tinh hãm địa) mang tính dao động và cảm xúc nhiều hơn, dễ thay
      đổi hướng đi và khó duy trì nhịp độ ổn định. Hóa Lộc tại Mệnh kết hợp với Thiên Lương tạo khuynh
      hướng hào phóng, nhưng ở đất Mộ và chịu áp lực Sát tinh cùng Hao khiến nguồn lực khó tích lũy bền
      vững. Cảm xúc nội tâm vừa là kênh nhận diện vấn đề nhạy bén, vừa là gánh nặng thường trực làm chậm
      quá trình ra quyết định.
    diem_manh:
    - nang_luc_id: phan_tich_van_de
      mo_ta: Bạn có khả năng tách một vấn đề phức tạp thành các thành phần, nhận ra cấu trúc và quan hệ
        nhân quả giữa chúng, từ đó xác định điểm then chốt cần xử lý. Đây là năng lực nổi trội và ổn định
        nhất trong hồ sơ, vận hành tự nhiên trong hầu hết các bối cảnh từ hoạch định chiến lược đến xử
        lý tình huống hàng ngày. Nó phát huy mạnh nhất khi bạn đối mặt với những vấn đề đòi hỏi phải nhìn
        thấu cơ chế vận hành bên trong thay vì chỉ phản ứng với bề mặt hiện tượng.
      giai_thich: Thiên Cơ miếu địa đồng cung Thiên Lương miếu địa tại Tuất tạo thành cách cục 'Thiên
        Ấm triều cương' — một trong những cấu trúc trí tuệ mạnh của Tử Vi, nhấn mạnh 'mưu trí' và khả
        năng 'bàn xét chính lược chiến lược.' Thiên Cơ mang lại óc phân tích cơ chế, sự sắc sảo trong
        việc tách bạch các yếu tố và quan hệ; Thiên Lương bổ sung khung nguyên tắc giúp đánh giá điều
        gì hợp lý, điều gì không. Tuần án ngữ Mệnh tuy hạn chế biểu hiện ra ngoài nhưng không làm giảm
        chiều sâu phân tích nội tại — nó buộc năng lực này hoạt động ở tầng sâu hơn, nơi sự phân tích
        trở nên kỹ lưỡng và có hệ thống hơn. Đà La hãm địa tuy tạo trì hoãn hành động nhưng đồng thời
        kéo dài thời gian suy xét, giúp phân tích thêm phần thorough.
      nang_luc: Phân tích vấn đề
    - nang_luc_id: nhin_da_chieu
      mo_ta: Trước khi đi đến kết luận, bạn thường xem xét cùng một vấn đề từ nhiều góc nhìn và nhiều
        tầng mức — từ chiến lược tổng thể đến chi tiết chiến thuật, từ lợi ích các bên liên quan đến các
        hệ quy chiếu giá trị khác nhau. Năng lực này hoạt động nổi bật khi bạn cần đánh giá những tình
        huống có nhiều bên liên quan hoặc khi vấn đề không thể giải quyết bằng một khung phân tích duy
        nhất. Trong các bối cảnh đơn giản hoặc cần quyết định nhanh, nó có thể nhường chỗ cho phân tích
        trực tiếp.
      giai_thich: Cách cục 'thiện đàm binh, cư Tuất, diệc vi mỹ luận' mô tả xu hướng bàn xét ở cả hai
        tầng chính lược và chiến lược — đây chính là biểu hiện tự nhiên của việc nhìn đa chiều. Thiên
        Cơ cung cấp khả năng phân tích ở tầng chi tiết và cơ chế (làm thế nào), trong khi Thiên Lương
        đặt mọi thứ trong khung nguyên tắc và đạo lý rộng hơn (tại sao, có nên không). Sự kết hợp này
        khiến bạn tự nhiên xem xét vấn đề từ ít nhất hai hệ quy chiếu song song. Hữu Bật tại Mệnh và Tả
        Phù chiếu từ Thiên Di góp phần mở rộng góc nhìn qua việc tiếp nhận và cân nhắc ý kiến từ nhiều
        nguồn. Hóa Lộc tại Mệnh nhắm vào Thiên Lương cũng bổ sung lăng kính lợi ích và chia sẻ, giúp bạn
        không chỉ phân tích kỹ thuật mà còn đánh giá tác động đến các bên.
      nang_luc: Nhìn đa chiều
    - nang_luc_id: he_thong_hoa_tri_thuc
      mo_ta: Bạn có xu hướng sắp xếp những gì mình học và trải nghiệm thành các hệ thống khái niệm có
        trật tự, phân nhóm rõ ràng để dễ truy xuất và tái sử dụng. Năng lực này phát huy tốt trong các
        bối cảnh đòi hỏi tổng hợp thông tin từ nhiều nguồn hoặc xây dựng khung tham chiếu cho bản thân
        và người khác. Tuy nhiên, nó hoạt động chủ yếu ở mặt nhận thức bên trong — hệ thống tri thức được
        xây dựng chắc chắn trong tư duy nhưng không phải lúc nào cũng được thể hiện thành tài liệu hay
        quy trình cụ thể bên ngoài.
      giai_thich: Thiên Cơ miếu địa mang 'óc kinh doanh' — khả năng tổ chức và sắp xếp các yếu tố thành
        hệ thống vận hành có logic. Phối hợp với Thiên Lương (ngôi sao của nguyên tắc và trật tự), cấu
        trúc Mệnh tạo khuynh hướng tự nhiên trong việc phân loại, nhóm và xây dựng khung khái niệm. Cách
        cục Cơ Nguyệt Đồng Lương hội hợp — với Thái Âm và Thiên Đồng từ cung Tài Bạch — củng cố mô hình
        làm việc có phương pháp và hệ thống. Văn Xương từ cung Thân tuy hãm địa nhưng vẫn góp phần hỗ
        trợ việc ghi chép và sắp xếp thông tin. Tuần tại Mệnh giới hạn việc hiện thực hóa hệ thống ra
        bên ngoài, nhưng năng lực tổ chức tri thức vẫn hoạt động mạnh ở tầng tư duy nội tại.
      nang_luc: Hệ thống hóa tri thức
    diem_yeu:
    - ten: Khoảng cách từ suy nghĩ đến hành động
      loai: han_che_truc_tiep
      mo_ta: Mặc dù có khả năng phân tích và hoạch định chiến lược sâu sắc, bạn thường gặp khó khăn khi
        chuyển những phân tích đó thành bước hành động cụ thể trong thực tế. Ý tưởng và kế hoạch có thể
        rất rõ ràng trong đầu nhưng quá trình hiện thực hóa thường bị trì hoãn, kéo dài hoặc mất đà trước
        khi thành hình. Hạn chế này hiện diện khá ổn định và trở nên rõ nhất khi bạn cần đưa ra bước đi
        đầu tiên hoặc cam kết một hướng hành động dứt khoát giữa nhiều lựa chọn.
      giai_thich: Tuần án ngữ cung Mệnh là yếu tố then chốt tạo ra khoảng cách này — Tuần có tính chất
        ngăn chặn và giam giữ, khiến năng lượng của Thiên Cơ và Thiên Lương không thể biểu hiện trọn vẹn
        ra bên ngoài, dù cả hai đều ở miếu địa. Đà La hãm địa đồng cung bổ sung lực kéo trì hoãn, tạo
        xu hướng quay vòng trong suy nghĩ thay vì tiến về phía trước. Thiên Cơ vốn chủ về mưu tính và
        cân nhắc — khi bị Tuần chặn, nó càng có xu hướng phân tích thêm thay vì hành động. Cấu trúc 'Cơ
        Lương đồng chiếu Mệnh Thân Không, vi tăng đạo' phản ánh xu hướng năng lực trí tuệ bị đẩy vào không
        gian nội tâm thay vì biểu hiện thành hành động thế tục. Quan Lộc tại Dần không có chính tinh lại
        chịu Triệt án ngữ càng làm cho phần sự nghiệp thiếu điểm tựa vững chắc để chuyển hóa tư duy thành
        kết quả.
    - ten: Xung đột giữa phân tích sắc bén và gánh nặng cảm xúc
      loai: xung_dot
      mo_ta: Bạn có khả năng nhìn thấu vấn đề và hiểu rõ cơ chế của mọi thứ, nhưng chính sự rõ ràng đó
        đi kèm với một gánh nặng cảm xúc đáng kể — lo lắng, ưu tư, đa sầu đa cảm. Càng phân tích sâu,
        bạn càng cảm nhận được trọng lượng của những gì mình thấy, và cảm xúc này ngược lại có thể làm
        mờ đi sự sắc bén vốn có hoặc kéo dài thời gian ra quyết định. Xung đột này hiện diện khá liên
        tục, đặc biệt trong những giai đoạn phải đối mặt với quyết định quan trọng hoặc khi chứng kiến
        những điều trái với nguyên tắc của mình.
      giai_thich: 'Thiên Khốc và Thiên Hư tại Mệnh tạo nên tính ''đa sầu đa cảm, suốt đời ưu tư phiền
        muộn'' — đây là lớp cảm xúc nền luôn hiện diện. Tang Môn tại Mệnh bổ sung chiều sâu ưu tư và sự
        cương nghị nhưng cũng nặng nề. Trong khi đó, Thiên Cơ và Thiên Lương cho khả năng phân tích sắc
        bén, nhìn rõ các vấn đề và rủi ro. Kết quả là một vòng lặp: phân tích càng rõ thì cảm nhận càng
        nặng, và cảm xúc nặng lại làm chậm phân tích. Cách cục ''Khốc Hư ngộ Cơ'' chỉ ra mối liên hệ trực
        tiếp giữa hai sao cảm xúc và Thiên Cơ, khiến sự lo lắng gắn chặt vào chính quá trình tư duy. Hóa
        Lộc tại Mệnh tuy mang nguồn lực nhưng ở đất Mộ và chịu áp lực Đà La, khiến ngay cả những điều
        tích cực cũng mang theo cảm giác bị kìm nén, không bung tỏa trọn vẹn.'
    - ten: Khó tích lũy nguồn lực bền vững
      loai: han_che_truc_tiep
      mo_ta: Dù có khả năng tạo ra và thu hút nguồn lực, bạn thường khó giữ chúng bền lâu — tiền tài,
        năng lượng hoặc thời gian có xu hướng hao tán nhanh hơn tốc độ tích lũy. Một phần đến từ bản tính
        hào phóng và sẵn sàng chia sẻ với người khác; phần khác đến từ việc thiếu cơ chế tự nhiên để giữ
        và bảo vệ những gì mình đã tạo ra. Hạn chế này biểu hiện rõ nhất trong quản lý tài chính và nguồn
        lực cá nhân, nơi sự tích lũy dài hạn đòi hỏi kỷ luật và cấu trúc mà năng lực hiện tại không tự
        nhiên hỗ trợ.
      giai_thich: Hóa Lộc tại Mệnh nhắm vào Thiên Lương tạo cách 'Lộc phùng Lương miếu, bảo tư tài ích
        dữ tha nhân' — người có Lộc nhưng dùng để giúp người khác, không giữ cho riêng mình. Hóa Lộc tại
        Tuất (đất Mộ) bị coi là 'Lộc như bị chôn vùi lấp kín, không thể thành đại phú' — năng lượng Lộc
        bị giam, không bung ra thành tích lũy lớn. Đà La hãm địa tại Mệnh cùng Hỏa Tinh và Linh Tinh từ
        cung Thân/Tài Bạch tạo nhóm Sát tinh hội hợp với Hóa Lộc, kích hoạt cách 'Hóa Lộc gặp Song Hao
        hay Sát tinh' dẫn đến 'tiêu pha hoang phí, tiền tài hao tán.' Tiểu Hao tại Quan Lộc chiếu về củng
        cố dòng chảy hao tán. Tổng hợp lại, nguồn lực đến nhưng không ở lại — vừa vì cấu trúc giam giữ
        (Tuần, Mộ), vừa vì khuynh hướng chia sẻ (Lương + Lộc), vừa vì lực hao tán (Sát + Hao).
    - ten: Dễ chuyển hướng khi chưa đi đủ sâu
      loai: qua_da
      mo_ta: Bạn có xu hướng thay đổi hướng đi, mục tiêu hoặc cách tiếp cận khá nhanh, thường trước khi
        hướng hiện tại kịp mang lại kết quả tích lũy. Điều này không phải do thiếu nhận thức mà do sự
        kết hợp giữa tính thất thường, mong muốn trải nghiệm cái mới, và cảm giác rằng hướng cũ không
        còn phù hợp. Biểu hiện này rõ nhất trong sự nghiệp và các dự án dài hạn, nơi sự kiên trì qua giai
        đoạn trung gian khó khăn là điều kiện tiên quyết. Khi nhận ra mẫu này, bạn có thể chủ ý tạo cơ
        chế cam kết để bù đắp.
      giai_thich: Cung Thân cư Tài Bạch tại Ngọ có Thiên Đồng hãm địa và Thái Âm hãm địa tọa thủ. Thiên
        Đồng hãm địa mang tính 'thất thường, hay thay đổi chí hướng, nghề nghiệp' — đây là động lực chính
        tạo ra sự chuyển hướng liên tục ở giai đoạn sau của cuộc đời. Thái Âm hãm địa bổ sung dao động
        cảm xúc, khiến quyết định về hướng đi bị ảnh hưởng bởi tâm trạng thay vì đánh giá lý trí. Thiên
        Mã tại Quan Lộc tạo lực đẩy di chuyển và thay đổi, nhưng Triệt tại cung Dần chặn đứng sự phát
        triển ổn định của sự nghiệp, khiến mỗi lần chuyển hướng đều gặp trở ngại mới thay vì tích lũy
        từ hướng cũ. Mệnh có Thiên Cơ 'biết quyền biến' nhưng quyền biến ở đây thiên về nhận thức (biết
        khi nào nên thay đổi) hơn là kỷ luật để bám đuổi một hướng đủ lâu.
- profile:
    name: Khanh
    birth_date: '1998-06-22'
    birth_time: 8
    gender: female
  output:
    tong_quan: 'Hồ sơ năng lực của bạn cho thấy một cấu trúc có sự phân hóa rõ rệt giữa năng lực cá nhân
      thuần túy và năng lực vận hành trong môi trường có cấu trúc sẵn. Mệnh có Thái Âm và Thiên Cơ đều
      hãm địa, lại thêm Hóa Kỵ bám vào Thiên Cơ, tạo ra lớp sương mù trên khả năng tư duy và phán đoán
      trực tiếp. Tuy nhiên, cách cục Cơ Nguyệt Đồng Lương hội hợp cùng Thiên Lương miếu địa tại Quan Lộc
      và mạng lưới cát tinh (Tả Hữu, Hóa Khoa, Hóa Quyền) bao quanh đã tạo ra một hệ thống bù trừ đáng
      kể: bạn hoạt động hiệu quả nhất khi có khung làm việc rõ ràng, có đồng đội hỗ trợ và có vai trò
      chuyên môn cụ thể. Điểm yếu nổi bật không nằm ở thiếu năng lực mà ở sự thiếu ổn định nội tại — giữa
      mong muốn nắm quyền kiểm soát (Hóa Quyền) và thực tế hay nhầm lẫn (Hóa Kỵ), giữa xu hướng thay đổi
      liên tục (Thiên Đồng hãm tại Thân) và yêu cầu phải duy trì đường hướng dài hạn.'
    diem_manh:
    - nang_luc_id: giai_quyet_cong_viec
      mo_ta: Trong môi trường chuyên nghiệp hoặc công việc có khung rõ ràng, bạn thể hiện khả năng đưa
        công việc qua các trở ngại thực tế một cách đáng tin cậy. Bạn có xu hướng tiếp cận vấn đề bằng
        kinh nghiệm tích lũy và sự cẩn trọng hơn là bằng trực giác nhanh, và khi có đủ thời gian cùng
        không gian làm việc ổn định, bạn xử lý công việc khá chắc chắn. Năng lực này nổi trội nhất trong
        các vai trò mang tính chuyên môn, hành chính hoặc tham mưu, nơi quy trình và tiêu chuẩn đã được
        xác định.
      giai_thich: 'Thiên Lương miếu địa tại cung Quan Lộc ở Ngọ là yếu tố then chốt: sách ghi ''công danh
        hoạnh đạt, văn võ kiêm toàn, văn chức hiển hách hơn võ chức.'' Hóa Khoa bám vào Hữu Bật tại cùng
        cung Quan Lộc bổ sung lớp trí tuệ uyên bác và khả năng giải trừ trở ngại. Thiên Lương bản chất
        ''có mưu cơ, biết quyền biến'' — không phải kiểu phân tích nhanh mà là sự thấu hiểu có chiều sâu,
        biết thích ứng trong phạm vi chuyên môn. Khi kết hợp với cách cục Cơ Nguyệt Đồng Lương (hội hợp
        cả bốn sao ở tam phương), năng lực giải quyết công việc của bạn được định hình theo hướng vận
        hành trong hệ thống có sẵn hơn là khai phá từ đầu.'
      nang_luc: Giải quyết công việc
    - nang_luc_id: cau_truc_hoa
      mo_ta: Bạn có khuynh hướng tự nhiên trong việc biến thông tin hoặc công việc rời rạc thành cấu trúc
        có trình tự và quan hệ rõ ràng. Khi đối diện với một vấn đề phức tạp, phản ứng đầu tiên của bạn
        thường là tìm cách phân loại, sắp xếp và tạo ra khung tham chiếu trước khi đi vào chi tiết. Năng
        lực này hoạt động ổn định trong nhiều bối cảnh khác nhau, đặc biệt khi bạn làm việc trong tổ chức
        hoặc nhóm có phân vai, nhưng có thể yếu đi khi bạn phải tự tạo cấu trúc hoàn toàn mới mà không
        có tiền lệ.
      giai_thich: Cách cục Cơ Nguyệt Đồng Lương là pattern chủ đạo tạo nên khuynh hướng này — sách Tân
        Biên ghi rõ 'thường là công chức,' nghĩa là tư duy vận hành theo hệ thống hành chính, có quy trình
        và phân cấp. Thiên Cơ (dù hãm) vẫn giữ bản chất 'chủ huynh đệ, phúc thọ' và khi hội với Thiên
        Lương, Đồng, Nguyệt, nó tạo thành một mạng lưới tư duy có tính phân loại và sắp xếp. Đẩu Quân
        tại Mệnh ('nghiêm nghị, khắc nghiệt, giữ gìn của cải bền vững') bổ sung lớp kỷ luật cá nhân giúp
        duy trì cấu trúc đã tạo. Tuy nhiên, vì cả Thiên Cơ và Thái Âm đều hãm, khả năng cấu trúc hóa này
        không đến từ sự sắc bén tức thì mà từ quá trình tích lũy và lặp lại trong môi trường quen thuộc.
      nang_luc: Cấu trúc hóa
    - nang_luc_id: hop_tac
      mo_ta: Bạn có khả năng làm việc cùng người khác theo hướng phối hợp và cùng đóng góp, đặc biệt khi
        vai trò của mỗi bên được xác định rõ. Bạn không phải kiểu dẫn dắt bằng uy tín cá nhân áp đảo,
        mà thu hút sự hỗ trợ bằng cách tạo không gian cho người khác tham gia vào hệ thống bạn đang vận
        hành. Năng lực hợp tác này ổn định khi có cấu trúc tổ chức làm khung, nhưng giảm đi khi làm việc
        một-một hoặc trong nhóm quá nhỏ không có quy tắc chung.
      giai_thich: 'Tả Phù tại Thiên Di (xung chiếu Mệnh) và Hữu Bật tại Quan Lộc (tam hợp) tạo thành bộ
        Tả Hữu đơn thủ chiếu Mệnh — sách ghi ''ly tông thứ xuất'' nhưng đồng thời ''gặp nhiều sao sáng
        sủa tốt đẹp thì được hưởng giàu sang và sống lâu.'' Sự hiện diện của Tả Hữu ở hai vị trí chiếu
        Mệnh cho thấy bạn có mạng lưới hỗ trợ tự nhiên: người khác sẵn sàng đóng góp khi bạn tạo ra khung
