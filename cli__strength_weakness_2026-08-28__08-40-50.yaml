        tá, giúp đỡ'' nhưng đồng thời mang tính mưu trí—tạo nên một nền tảng linh hoạt: bạn vừa có sáng
        kiến (Lộc Tồn), vừa có khả năng đánh giá nhanh các lựa chọn (Tả-Hữu mưu trí). Cự Môn vượng địa
        tại Thân bổ sung khả năng xét đoán tình huống sắc bén, giúp việc điều chỉnh không chỉ nhanh mà
        còn có cơ sở.'
      nang_luc: Ứng biến
    - nang_luc_id: phan_tich_van_de
      mo_ta: Bạn có thói quen tách vấn đề thành các thành phần để hiểu cấu trúc và quan hệ bên trong trước
        khi hành động, thay vì phản ứng theo bề mặt. Khuynh hướng này giúp bạn nhận ra điểm mấu chốt cần
        xử lý và sắp xếp thứ tự ưu tiên hợp lý. Năng lực phân tích thể hiện rõ khi đối mặt với vấn đề
        phức tạp có nhiều biến số, nhưng có thể chậm phát huy trong những tình huống đòi hỏi hành động
        ngay lập tức mà không có thời gian suy xét.
      giai_thich: Cự Môn vượng địa tại Ngọ mang đặc tính 'có trí xét đoán sáng suốt'—khả năng nhìn xuyên
        qua bề mặt thông tin để nắm bản chất. Tả-Hữu chiếu Mệnh bổ sung 'có nhiều mưu trí,' tức là tư
        duy chiến lược đa chiều. Lộc Tồn tại Thân thêm 'có tài tổ chức'—khả năng sắp xếp các mảnh thông
        tin thành cấu trúc mạch lạc. Quan Lộc vô chính diệu tại Dần không bị chi phối bởi một chính tinh
