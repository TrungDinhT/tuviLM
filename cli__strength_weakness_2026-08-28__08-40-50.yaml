        kết hợp giữa Phá Quân — vốn đã là sao hành động nhanh và cương quả — với Văn Khúc hãm và Hóa Kỵ
        tạo ra một khuynh hướng impulsivity rõ rệt: năng lượng hành động rất lớn nhưng bộ lọc suy xét
        bị suy yếu. Cách cục ''Dương Đà giáp Kỵ vi bại cục'' (Kình Dương và Đà La giáp Hóa Kỵ tại Mệnh)
        còn khuếch đại hậu quả của sự thiếu suy xét, biến những nhầm lẫn nhỏ thành những vấn đề lớn hơn.'
    - ten: Dễ bị ảnh hưởng bởi lời nịnh, khó đọc động cơ người khác
      loai: han_che_truc_tiep
      mo_ta: 'Bạn dễ bị ảnh hưởng bởi những lời khen ngợi hoặc sự tán đồng bề ngoài, đôi khi không nhận
        ra động cơ thực sự đằng sau hành vi của người khác. Hạn chế này biểu hiện ở mức đáng lưu ý: dù
        bạn là người thông minh và có học thức, trong các tình huống giao tiếp mà đối phương tỏ ra ủng
        hộ hoặc tâng bốc, bạn có xu hướng tin vào lời họ hơn là đánh giá khách quan hành động thực tế
        của họ. Điều này dễ dẫn đến việc đặt niềm tin sai chỗ hoặc bị dẫn dắt bởi những người khéo nói,
        đặc biệt trong những lĩnh vực mà bạn không có chuyên môn sâu để tự kiểm chứng.'
      giai_thich: Cách cục 'Phá Quân nhất diệu, tính nan minh' áp dụng trực tiếp cho trường hợp Phá Quân
        đơn thủ tại Mệnh không gặp chính diệu khác đồng cung — Tân Biên ghi rõ đây là người 'không sáng
        suốt, hay nghe nịnh hót'. Mặc dù Lộc Tồn đồng cung mang lại trí thông minh và học thức, nó không
        đủ để bù đắp khiếm khuyết đặc thù này của Phá Quân đơn thủ, vì 'tính nan minh' ở đây liên quan
        cụ thể đến khả năng phán đoán về người khác và về những thông tin được trình bày một cách khéo
        léo. Hóa Kỵ tại Mệnh, với đặc tính 'ích kỷ', có thể tạo ảo giác rằng bản thân đang cảnh giác,
        nhưng thực tế nó chỉ khiến người này thêm đề phòng ở mặt lợi ích cá nhân mà vẫn dễ bị lung lạc
        bởi sự nịnh hót trực tiếp — một blind spot nằm đúng ở nơi mà trí thông minh chung không chạm tới
        được.
    - ten: Phản ứng cảm xúc mạnh trong lời nói, dễ vướng thị phi
      loai: qua_da
      mo_ta: 'Bạn có xu hướng phản ứng cảm xúc mạnh trong lời nói, dễ gắt gỏng hoặc nói năng thiếu kiềm
        chế khi gặp điều trái ý, và điều này thường kéo theo thị phi hoặc hiểu lầm trong giao tiếp. Biểu
        hiện này khá nổi bật ở bạn: dù bình thường bạn có thể rất vui tính và hài hước, khi bị kích động
        hoặc không vừa lòng, cách diễn đạt dễ trở nên thô lỗ hoặc gây mất lòng. Nó đặc biệt xuất hiện
        trong các tình huống mà bạn cảm thấy bị thách thức hoặc khi công việc không diễn ra theo ý muốn,
        và hậu quả thường kéo dài hơn bản thân lời nói — dưới dạng tranh cãi, hiểu lầm hoặc mất lòng tin
        từ người xung quanh.'
      giai_thich: Cách cục 'Phá tọa Ly, ngôn ngữ thô bạo' mô tả trực tiếp khuynh hướng lời nói khi Phá
        Quân tọa thủ tại Ngọ (Ly cung). Mặc dù cách cục 'Phá tọa Ly phùng Lộc, Dương nan giải xướng cuồng'
        cho thấy Lộc Tồn và Thiếu Âm đồng cung làm chuyển hóa một phần thành tính vui vẻ, hay nói đùa,
        nhưng gốc rễ của sự thô bạo trong ngôn ngữ vẫn tồn tại và dễ trỗi dậy khi cảm xúc mạnh. Hóa Kỵ
        thủ Mệnh, với đặc tính gây 'thị phi khẩu thiệt', cộng hưởng với khuynh hướng này, khiến những
        lúc phản ứng cảm xúc không chỉ gây khó chịu tức thời mà còn kéo theo hệ quả thị phi kéo dài. Sự
        kết hợp giữa Phá Quân (năng lượng bộc phát mạnh), Hóa Kỵ (khuếch đại mặt tiêu cực của giao tiếp)
        và vị trí Ngọ (hỏa, nóng nảy) tạo nên một pattern mà cảm xúc dễ tràn vào lời nói trước khi lý
        trí kịp điều chỉnh.
- profile:
    name: Len
    birth_date: '2002-02-13'
    birth_time: 12
    gender: female
  output:
    tong_quan: 'Hồ sơ năng lực của bạn có hình thái tập trung rõ rệt: trục sức mạnh nằm ở lĩnh vực trí
      tuệ và ngôn ngữ, với khả năng tranh luận đanh thép và phân tích cấu trúc vấn đề tạo thành hai trụ
      cột chính. Ngược lại, trục hành động và thực thi bị phân tán bởi nhiều ràng buộc cấu trúc — từ sự
      do dự khi chốt quyết định, nhịp độ trồi sụt theo thời gian, đến khoảng cách hệ thống giữa tư duy
      và hiện thực hóa. Sự chênh lệch này tạo ra một mâu thuẫn nội tại xuyên suốt: bạn nhìn thấy vấn đề
      rất rõ và lập luận rất thuyết phục, nhưng năng lực biến những điều đó thành kết quả cụ thể lại bị
      kìm hãm bởi chính cấu trúc lá số. Nền tảng cảm xúc đi kèm là xu hướng ưu tư và bất mãn mãn tính,
      làm trầm trọng thêm khoảng cách giữa kỳ vọng và thực tế.'
    diem_manh:
    - nang_luc_id: tranh_bien
      mo_ta: Bạn có khả năng đối đáp trực tiếp với lập luận của người khác, chỉ ra điểm yếu trong lý lẽ
        của họ và bảo vệ quan điểm của mình một cách đanh thép, có hệ thống. Đây là năng lực nổi bật nhất
        và ổn định trong hồ sơ, phát huy rộng rãi trong hầu hết các tình huống cần trao đổi, tranh luận
        hoặc bảo vệ lập trường — từ thảo luận chuyên môn đến các tình huống pháp lý hoặc đàm phán. Khả
        năng này đặc biệt mạnh khi bạn có thời gian chuẩn bị lý lẽ và khi đối phương đưa ra lập luận có
        cấu trúc để bạn phân tích; trong các tình huống cần phản ứng tức thì mà không có thời gian suy
        nghĩ, mức độ đanh thép có thể giảm đi.
      giai_thich: 'Cự Môn đắc địa thủ Mệnh là yếu tố cốt lõi: Cự Môn chủ ngôn ngữ, khi đắc địa tại Thân
        mang lại lời nói sắc bén, mưu cơ và trí xét đoán sáng suốt. Phối hợp với bộ Hổ–Tuế–Phù hội hợp
        qua Bạch Hổ xung chiếu từ Thiên Di và Quan Phủ tam hợp từ Quan Lộc, cấu trúc này tạo thành cách
        cục ''Cự Môn miếu vượng đắc địa gặp Hổ Tuế Phù'' — người biết nhiều luật pháp, hay lý luận, thiên
        về tư pháp và ngoại giao. Văn Xương đắc địa ở Tài Bạch tam hợp chiếu Mệnh bổ sung lớp tư duy hệ
        thống và văn chương, giúp lập luận không chỉ đanh thép mà còn chặt chẽ. Thái Dương tuy hãm địa
        nhưng được Tuần án ngữ tại Mệnh nên lấy lại phần nào ánh sáng, góp thêm sự tự tin và khả năng
        tỏa sáng khi trình bày trước người khác.'
      nang_luc: Tranh biện
    - nang_luc_id: phan_tich_van_de
      mo_ta: Bạn có xu hướng tự nhiên tách một vấn đề phức tạp thành các thành phần để hiểu cấu trúc,
        quan hệ giữa chúng và xác định điểm cần xử lý. Năng lực này hoạt động ổn định trong nhiều bối
        cảnh, từ phân tích chuyên môn, đánh giá tình huống đến việc đọc hiểu các hệ thống quy tắc. Bạn
        thường nhìn thấy cấu trúc ẩn sau bề mặt thông tin và có thể chỉ ra mối liên hệ mà người khác bỏ
        sót. Khả năng này phát huy tốt nhất khi vấn đề có tính hệ thống hoặc liên quan đến quy tắc, luật
        lệ; với các vấn đề thuần túy cảm xúc hoặc mơ hồ, mức độ phân tích có thể không đồng đều.
      giai_thich: Cự Môn đắc địa tại Mệnh mang lại 'mưu cơ' và 'trí xét đoán sáng suốt' — nền tảng trực
        tiếp của khả năng phân tích cấu trúc. Cự Nhật đồng cung tại Thân tạo thành cách cục 'quan phong
        tam đại', cho thấy truyền thống trí tuệ và phân tích được tích lũy qua nhiều thế hệ, tạo ra chiều
        sâu tự nhiên trong cách tiếp cận vấn đề. Thái Dương tuy hãm địa nhưng nhờ Tuần án ngữ nên vẫn
        đóng góp trí thông minh và khả năng nhìn nhận tổng thể. Văn Xương đắc địa ở Tài Bạch chiếu Mệnh
        bổ sung tư duy có phương pháp và khả năng hệ thống hóa thông tin. Sự phối hợp giữa Cự Môn (phân
        tích ngôn ngữ và cấu trúc) với các yếu tố trí tuệ trong tam phương tạo nên năng lực phân tích
        vững, đặc biệt khi vấn đề liên quan đến hệ thống quy tắc hoặc lập luận phức tạp.
      nang_luc: Phân tích vấn đề
    diem_yeu:
    - ten: Do dự khi cần chốt quyết định
      loai: han_che_truc_tiep
      mo_ta: 'Khi đứng trước nhiều lựa chọn, bạn thường kéo dài thời gian cân nhắc và khó đi đến một quyết
        định dứt khoát, ngay cả khi đã có đủ thông tin cần thiết. Hạn chế này hiện diện khá ổn định: bạn
        có thể phân tích rất tốt các phương án nhưng đến bước cam kết thì lại chần chừ, muốn xem xét thêm
        hoặc lo ngại bỏ lỡ phương án tốt hơn. Biểu hiện này rõ nhất trong các quyết định có tính dài hạn
        hoặc liên quan đến tài chính, nơi áp lực chọn lựa cao và hậu quả khó đảo ngược; trong các quyết
        định nhỏ hàng ngày, mức độ ảnh hưởng nhẹ hơn.'
      giai_thich: 'Cách cục ''Hao thủ Mệnh'' là yếu tố trực tiếp nhất: Tiểu Hao tọa thủ tại Mệnh cùng
        Đại Hao xung chiếu từ Thiên Di tạo thành mô tả cổ điển ''khôn ngoan nhưng không quả quyết''. Song
        Hao mang tính phân tán, làm năng lượng bị chia nhỏ ra nhiều hướng thay vì tập trung vào một lựa
        chọn. Cự Môn tuy đắc địa nhưng bản chất là ám tinh, mang tính đa nghi và thận trọng quá mức —
        khi kết hợp với Hao, sự thận trọng này biến thành do dự kéo dài. Thái Dương hãm địa cũng góp phần
        làm giảm sự cương nghị, khiến lực đẩy cần thiết để chốt quyết định bị yếu đi. Tử Mã (Thiên Mã
        bị Tuần chặn tại Mệnh) làm giảm khả năng xoay chuyển nhanh, khiến việc chuyển từ giai đoạn cân
        nhắc sang cam kết càng thêm chậm chạp.'
    - ten: Khó duy trì nhịp độ đều đặn
      loai: han_che_truc_tiep
      mo_ta: Bạn thường bắt đầu công việc với năng lượng cao và sự chuyên cần, nhưng sau giai đoạn đầu
        thì nhịp độ giảm rõ rệt — có xu hướng trễ nải, mất hứng hoặc bỏ dở khi công việc kéo dài. Hạn
        chế này khá ổn định và xuất hiện trong nhiều bối cảnh, từ công việc chuyên môn đến các dự án cá
        nhân. Nó đặc biệt rõ khi công việc đòi hỏi sự lặp đi lặp lại hoặc khi kết quả không đến nhanh.
        Những giai đoạn có áp lực bên ngoài hoặc có người đồng hành có thể giúp bạn duy trì tốt hơn, nhưng
        khi làm việc độc lập thì nhịp độ dễ trồi sụt.
      giai_thich: 'Thái Dương hãm địa thủ Mệnh là nguồn gốc chính: sách ghi rõ Nhật hãm ''không bền chí,
        không cương nghị'', và cách cục ''Nhật tại Mùi Thân Mệnh vị, vi nhân tiên cần hậu lấn'' mô tả
        chính xác mô hình ''chuyên cần buổi đầu, lười biếng về sau''. Thái Dương tượng trưng cho mặt trời
        — khi hãm địa, ánh sáng và năng lượng không duy trì được ở mức cao. Tuần án ngữ giúp cải thiện
        phần nào (biến hãm thành sáng hơn), nhưng bản chất kìm hãm và làm chậm của Tuần cũng làm giảm
        cường độ năng lượng liên tục. Tang Môn và Bạch Hổ hội hợp mang lại sự can đảm ban đầu nhưng cũng
        kéo theo ''ưu tư phiền muộn suốt đời'', tạo ra gánh nặng cảm xúc làm hao mòn sức bền theo thời
        gian. Hỏa Tinh và Linh Tinh giáp Mệnh tạo thành bại cục, khiến người này ''suốt đời chẳng mấy
        khi được xứng ý toại lòng'', làm giảm động lực duy trì nỗ lực khi kết quả không đáp ứng kỳ vọng.'
    - ten: Khoảng cách giữa tư duy và thực thi
      loai: xung_dot
      mo_ta: 'Bạn thường có những phân tích sắc bén và ý tưởng rõ ràng về điều cần làm, nhưng khi cần
        chuyển chúng thành bước hành động cụ thể trong thực tế thì gặp trở ngại đáng kể. Ý tưởng càng
        lớn hoặc càng phức tạp thì khoảng cách này càng rõ — bạn có thể tranh luận rất thuyết phục về
        một kế hoạch nhưng lại khó bắt tay vào thực hiện nó. Xung đột này hiện diện xuyên suốt và tạo
        ra cảm giác bất mãn mãn tính: bạn biết mình có thể nghĩ tốt hơn nhiều người khác, nhưng kết quả
        thực tế lại không phản ánh đúng năng lực tư duy đó. Biểu hiện này giảm bớt khi có người hỗ trợ
        cụ thể hóa các bước hoặc khi công việc có quy trình sẵn để bám vào.'
      giai_thich: 'Xung đột này là hệ quả của sự chênh lệch cấu trúc giữa nửa trí tuệ và nửa hành động
        trong lá số. Phía tư duy được nâng đỡ bởi Cự Môn đắc địa (thông minh, mưu cơ, xét đoán sáng suốt),
        Văn Xương đắc địa (tư duy hệ thống) và Cự Nhật đồng cung (truyền thống trí tuệ). Phía hành động
        bị kìm hãm bởi nhiều yếu tố đồng thời: Thiên Mã bị Tuần chặn tạo thành cách cục Tử Mã — ''ngựa
        mất đường chạy'', làm giảm khả năng động, phát và xoay chuyển; Song Hao phân tán năng lượng hành
        động; Hỏa Tinh và Linh Tinh giáp Mệnh tạo thành bại cục. Sự kết hợp giữa năng lực tư duy cao và
        năng lực thực thi bị ràng buộc tạo ra mâu thuẫn nội tại: tầm nhìn vượt xa khả năng hiện thực hóa.
        Cô Thần thủ Mệnh và Tang Hổ hội hợp còn tạo thêm xu hướng co mình và ưu tư, khiến người này ít
        tìm kiếm sự hỗ trợ bên ngoài để bù đắp khoảng trống thực thi.'
- profile:
    name: Oanh
    birth_date: '1998-12-11'
    birth_time: 2
    gender: female
  output:
    tong_quan: 'Lá số này có cấu trúc Mệnh–Thân phân ly rõ rệt: Mệnh mang Thất Sát hãm địa cùng Địa Không
      và nhiều sát tinh, tạo nên năng lượng hành động mãnh liệt, thiên về phản ứng nhanh và bứt phá trong
      tình huống khó; trong khi Thân cư Phúc Đức có Tử Vi đắc địa nhưng bị Triệt chặn và Kiếp Hỏa bao
      vây, khiến lớp khát vọng sâu hơn về trật tự và sự kiểm soát khó biểu hiện trọn vẹn. Thiên Di có
      Liêm Phủ đều miếu địa tạo điểm tựa tốt khi hoạt động bên ngoài, tương phản với nội cung nhiều xáo
      trộn. Tổng thể, profile nghiêng về người vận hành hiệu quả trong các đợt bùng phát ngắn và môi trường
