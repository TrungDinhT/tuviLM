        sự nghiệp chính thức, cấu trúc nền tảng của Mệnh vẫn giữ nguyên năng lực cấu trúc hóa, thể hiện
        qua cách bạn tổ chức đời sống và công việc hàng ngày hơn là qua vị trí công việc cụ thể.'
      nang_luc: Cấu trúc hóa
    - nang_luc_id: quyet_doan
      mo_ta: Khi đối diện một lựa chọn, bạn có xu hướng chốt phương án nhanh và cam kết với nó thay vì
        kéo dài do dự. Sự quyết đoán này đi kèm khả năng bắt tay vào hành động ngay sau khi quyết định
        – bạn không mắc kẹt ở giai đoạn chuẩn bị hay phân tích lặp lại. Đây là đặc điểm nổi bật và gần
        như bản năng, xuất hiện cả trong quyết định nhỏ hàng ngày lẫn những bước ngoặt lớn. Tuy nhiên,
        nó phát huy tốt nhất khi bạn đã có đủ thông tin cơ bản; trong trường hợp hoàn toàn mơ hồ, tốc
        độ quyết định có thể chuyển thành vội vàng.
      giai_thich: Vũ Khúc miếu địa mang tính 'quả quyết, cương nghị, hiếu thắng' theo Tân Biên, tạo nền
        tảng cho sự quyết đoán. Phá Quân miếu ở cung Thân (Thân cư Phúc Đức) bổ sung khả năng hành động
        dứt khoát, thậm chí chấp nhận phá bỏ cái cũ để chuyển hướng. Tang Môn thủ Mệnh và Bạch Hổ xung
        chiếu tạo thêm sự can đảm, dám chịu trách nhiệm cho lựa chọn của mình. Cụm sát tinh Đà La–Địa
        Không tại Mệnh và Kình Dương–Hỏa Tinh tại Thân không làm giảm quyết đoán mà ngược lại tăng thêm
        lực đẩy, khiến một khi đã quyết, bạn hành động với cường độ rất cao. Cách cục Tử Vi Vũ Khúc Sát
        diệu cho thấy người 'thích được tiếng anh hùng' – yếu tố này củng cố xu hướng dám quyết và dám
        đứng tên cho quyết định.
      nang_luc: Quyết đoán
    - nang_luc_id: hoat_dong_trong_moi_truong_bien_dong
      mo_ta: 'Bạn thể hiện tốt nhất trong những hoàn cảnh mà người khác thấy bất an hoặc quá tải: khi
        tình hình thay đổi liên tục, kế hoạch đổ vỡ, hoặc xuất hiện yếu tố bất thường cần phản ứng ngay.
        Trong môi trường ổn định và lặp lại, bạn có thể giảm hứng thú và mất dần năng lượng; nhưng khi
        biến động xảy ra, sự sắc sảo và khả năng hành động của bạn được kích hoạt mạnh mẽ. Đây là năng
        lực bứt phá chứ không phải duy trì – bạn tỏa sáng ở những thời điểm bước ngoặt hơn là trong giai
        đoạn vận hành đều đặn.'
      giai_thich: Cách cục Mệnh Không Thân Kiếp là trung tâm của năng lực này. Tân Biên mô tả người có
        cấu trúc này 'rất khôn ngoan sắc sảo' và 'có khả năng bứt phá trong hoàn cảnh bất thường'. Địa
        Không hãm tại Mệnh tạo tư duy khác biệt, không theo lối mòn; Địa Kiếp hãm tại Thân (cung Phúc
        Đức) thúc đẩy hành động quyết liệt và sẵn sàng đổi hướng lớn. Phá Quân miếu ở Thân vốn là sao
        chủ về cải cách, phá旧 lập mới, càng phát huy trong bối cảnh cần thay đổi căn bản. Hỏa Tinh đắc
